<script>
'use strict';
/* Phoenix Workspace — Portal
 * เข้าสู่ระบบ/สมัคร · หน้าของผู้ปฏิบัติงานโครงการ (ลงเวลา, ยื่นลา, ใบลาของฉัน, การลงเวลา) · ผลสแกนรหัส QR หน้าห้อง (?p=ci)
 * · จุดลงเวลา (จอ QR หน้าห้อง + สแกนรหัส QR บุคคลสำรอง)
 * · หน้าฝ่ายเลขานุการโครงการ (ลงเวลา, รับรองใบลา, ผู้ใช้) · ตัวช่วยสรุปการลงเวลาสำหรับรายบุคคล/รายงาน
 * ทำงานใน scope เดียวกับ App (ใช้ st, IX, $, call, go, RENDER ฯลฯ ร่วมกัน)
 */

// ================================================================== สิทธิ์ & หน้า
var PAGES = {
  SECRETARY: ['dash', 'clock', 'leave2', 'meet', 'report', 'users', 'system', 'station', 'account', 'ci'],
  MEMBER: ['home', 'leave', 'person', 'mymeet', 'account', 'ci'],
  STATION: ['station', 'account', 'ci'],
  PUBLIC: ['dash', 'person', 'meet', 'report']
};
var HOME = { SECRETARY: 'dash', MEMBER: 'home', STATION: 'station', PUBLIC: 'dash' };
var ROLE_TH = { SECRETARY: 'ฝ่ายเลขานุการโครงการ', MEMBER: 'ผู้ปฏิบัติงานโครงการ', STATION: 'จุดลงเวลา', PUBLIC: 'ผู้ชม' };
var LV_ST = { PENDING: ['รอรับรอง', 'warn'], CERTIFIED: ['✓ บันทึกแล้ว', 'good'], REJECTED: ['✗ ไม่รับรอง', 'bad'],
  CANCELLED: ['ยกเลิกแล้ว', 'na'], REVOKED: ['เพิกถอนแล้ว', 'bad'] };
var ACC_ST = { PENDING: ['รออนุมัติ', 'warn'], ACTIVE: ['ใช้งาน', 'good'], SUSPENDED: ['ระงับ', 'bad'], REJECTED: ['ปฏิเสธ', 'na'] };
var TH_WD_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

function canSee(page) { return (PAGES[st.role] || PAGES.PUBLIC).indexOf(page) !== -1; }
function homePage() { return HOME[st.role] || 'dash'; }
function isStaff() { return st.role === 'SECRETARY'; }
function pill(label, kind) { return '<span class="st ' + (kind || 'na') + '">' + esc(label) + '</span>'; }
function hmOf(iso) { return iso ? String(iso).slice(11, 16) : ''; }
/** ป้ายบอกวิธีการลงเวลา + ผลตรวจพิกัด (ใช้ทั้งหน้าจุดลงเวลาและหน้าตรวจสอบ) */
var METHOD_L = { ROOM: 'QR หน้าห้อง', PIN: 'รหัส 6 หลัก', QR: 'QR ส่วนตัว', SELF: 'ลงเวลาด้วยตนเอง',
                 PRE: 'ลงเวลาล่วงหน้าก่อนเปิดรับ', MANUAL: 'ฝ่ายเลขานุการโครงการบันทึกแทน' };
var GEO_TH = { OK: ['อยู่ในพื้นที่ที่กำหนด', 't-good'], FUZZY: ['ตำแหน่งไม่แน่ชัด', 't-warn'],
               FAR: ['อยู่นอกพื้นที่ที่กำหนด', 't-bad'], NONE: ['ไม่พบข้อมูลตำแหน่ง', 'muted'], OFF: ['', 'muted'] };
/** ลิงก์เปิด Google Maps ที่พิกัดนี้ในแท็บใหม่ — ไม่ต้องขอ API key */
function geoMapUrl_(lat, lng) { return 'https://www.google.com/maps?q=' + encodeURIComponent(lat) + ',' + encodeURIComponent(lng); }
function hasLatLng_(lat, lng) { return lat !== '' && lat != null && lng !== '' && lng != null; }
/** ป้ายผลตรวจพิกัด — ถ้ามีพิกัดดิบ (lat/lng) แปะไว้ ป้ายจะกดเปิดดูตำแหน่งบน Google Maps ได้ */
function geoBadge(txt, lat, lng) {
  var p = String(txt || '').split('|'), g = GEO_TH[p[0]];
  if (!g || !g[0]) return '';
  var detail = p[1] ? ' ' + p[1].replace('m', ' ม.') : '';
  var body = '◉ ' + g[0] + detail;
  if (hasLatLng_(lat, lng)) {
    return '<a class="' + g[1] + ' small geo-link" href="' + geoMapUrl_(lat, lng) + '" target="_blank" rel="noopener" ' +
      'title="' + esc(String(txt)) + ' · แตะเพื่อดูตำแหน่งบน Google Maps">' + body + ' 🗺️</a>';
  }
  return '<span class="' + g[1] + ' small" title="' + esc(String(txt)) + '">' + body + '</span>';
}
function methodBadge(m) {
  m = String(m || '').toUpperCase();
  if (!m || m === 'ROOM' || m === 'QR') return '';
  return '<span class="muted small">' + esc(METHOD_L[m] || m) + '</span>';
}
function toM(t) { return t ? toMin(t) : 0; }
function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function workStart() { return S('WORK_START') || '08:00'; }
function workEnd() { return S('WORK_END') || '16:00'; }
function clockStart() { return S('CLOCK_START') || st.d.today; }
/* isWorkday(d) อยู่ใน App.html — ใช้รอบวันทำการโครงการ + ช่วงยกเว้น (Settings.WORK_WEEK / WORK_EXCLUDE) */
function daysBetween(a, b) { return Math.round((D(b) - D(a)) / 86400000); }
function initials(n) { n = String(n || '').replace(/^(นางสาว|นาง|นาย|น\.ส\.)\s*/, '').replace(/^[เแโใไ]/, '').trim(); return n ? n.charAt(0).toUpperCase() : '?'; }

function applyRole() {
  var role = st.role;
  document.body.setAttribute('data-role', role);
  $('#topbar').classList.remove('hide');
  $$('#nav [data-page]').forEach(function (b) { b.classList.toggle('hide', !canSee(b.getAttribute('data-page'))); });
  $('#tabbar').classList.toggle('hide', role !== 'MEMBER');
  $('#stationBtn').classList.toggle('hide', role !== 'SECRETARY');
  $('#supportCta').classList.toggle('hide', role !== 'SECRETARY');
  var navPerson = $('#nav [data-page="person"]'); if (navPerson) navPerson.textContent = role === 'MEMBER' ? 'สรุปของฉัน' : 'รายบุคคล';
  renderUserChip();
}
function renderUserChip() {
  var a = st.d && st.d.auth;
  $('#userName').textContent = a ? a.name : 'เข้าสู่ระบบ';
  $('#userAvatar').textContent = a ? initials(a.name) : '→';
  $('#userBtn').title = a ? (ROLE_TH[a.role] || a.role) + ' · บัญชีของฉัน' : 'เข้าสู่ระบบ';
}
$('#userBtn').addEventListener('click', function () {
  if (!st.d || !st.d.auth) return showAuth();
  go('account');
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-go]');
  if (b) { e.preventDefault(); go(b.getAttribute('data-go')); return; }
  var op = e.target.closest('[data-open-person]');
  if (op) { st.personId = op.getAttribute('data-open-person'); st.pFy = fyOf(st.d.today); go('person'); }
});

// ================================================================== เข้าสู่ระบบ / สมัคร
function showAuth(msg) {
  stopPageTimers();
  $('#authView').classList.remove('hide');
  $('#topbar').classList.add('hide'); $('#tabbar').classList.add('hide');
  $('#main').classList.add('hide');
  var note = $('#authNote');
  var routeMsg = ROUTE.p === 'scan' && ROUTE.c ? 'QR ลงเวลา — เข้าสู่ระบบด้วยบัญชีจุดลงเวลาหรือฝ่ายเลขานุการโครงการเพื่อบันทึกเวลา' : '';
  var ok = false;
  if (ROUTE.p === 'ci' && !st._routeDone) {
    if (ROUTE.err) routeMsg = 'QR หน้าห้อง: ' + ROUTE.err;
    else {
      ok = true;
      routeMsg = '✓ สแกนรหัส QR ' + (ROUTE.mode === 'OUT' ? 'ลงเวลากลับ' : 'ลงเวลามาปฏิบัติงาน') + ' แล้ว (' + ROUTE.hm + ' น.) — เข้าสู่ระบบเพื่อบันทึกเวลา' +
        ' · ทำครั้งเดียว ระบบจะบันทึกไว้ในเครื่องนี้ · ต้องเข้าสู่ระบบภายใน ' + (ROUTE.claimMin || 15) + ' นาที';
    }
  }
  var m = msg || routeMsg;
  note.textContent = m || ''; note.classList.toggle('hide', !m);
  note.className = 'note' + (ok && !msg ? ' good' : ' warn') + (m ? '' : ' hide');
  var u = $('#loginForm [name=username]'); if (u && !u.value) u.value = store('px_user') || '';
  setTimeout(function () { var f = u && u.value ? $('#loginForm [name=password]') : u; if (f) f.focus(); }, 50);
}
function hideAuth() {
  $('#authView').classList.add('hide');
  $('#main').classList.remove('hide');
}
$('#authTabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-at]'); if (!b) return;
  var t = b.getAttribute('data-at');
  $$('#authTabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
  $('#loginForm').classList.toggle('hide', t !== 'login'); $('#regForm').classList.toggle('hide', t !== 'register');
  $('#authNote').classList.add('hide');
});
$('#regStaff').addEventListener('change', function () { $('#regPinBox').classList.toggle('hide', !this.checked); });
(function () {
  var sap = $('#regForm [name=sap]'), un = $('#regForm [name=username]'), last = '';
  sap.addEventListener('input', function () {
    if (!un.value || un.value === last) { un.value = sap.value.replace(/\D/g, ''); last = un.value; }
  });
})();
$('#loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = this, b = $('#loginGo');
  var u = f.username.value.trim(), p = f.password.value;
  if (!u || !p) return;
  b.disabled = true; b.textContent = 'กำลังเข้าสู่ระบบ…';
  call('apiLogin', u, p, navigator.userAgent).then(function (r) {
    st.token = r.token; store('px_tok', r.token); store('px_user', u);
    f.password.value = '';
    st.page = ''; st.personId = '';
    $('#loading').classList.remove('hide');
    $('#loading').innerHTML = '<div class="spin"></div><div>กำลังโหลดข้อมูล…</div>';
    hideAuth();
    return load(false);
  }).catch(function (err) {
    var n = $('#authNote'); n.textContent = err.message; n.classList.remove('hide');
  }).then(function () { b.disabled = false; b.textContent = 'เข้าสู่ระบบ'; });
});
$('#regForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = this, b = $('#regGo'), o = {};
  ['fullName', 'sap', 'username', 'password', 'confirm', 'email', 'phone', 'team', 'ward', 'division', 'staffPin'].forEach(function (n) { o[n] = f[n].value.trim(); });
  if (!$('#regStaff').checked) o.staffPin = '';
  var n = $('#authNote');
  var pwErr = pwBad(o.password);
  if (pwErr) { n.textContent = pwErr; n.classList.remove('hide'); return; }
  if (o.password !== o.confirm) { n.textContent = 'การยืนยันรหัสผ่านไม่ตรงกัน'; n.classList.remove('hide'); return; }
  b.disabled = true;
  call('apiRegister', o).then(function (r) {
    store('px_user', o.username);
    f.reset(); $('#regPinBox').classList.add('hide');
    $$('#authTabs button')[0].click();
    $('#loginForm [name=username]').value = o.username;
    n.className = 'note'; n.textContent = r.message; n.classList.remove('hide');
    setTimeout(function () { n.className = 'note warn' + (n.classList.contains('hide') ? ' hide' : ''); }, 12000);
  }).catch(function (err) { n.className = 'note warn'; n.textContent = err.message; n.classList.remove('hide'); })
    .then(function () { b.disabled = false; });
});
function logout() {
  call('apiLogout', st.token).catch(function () {});
  st.token = ''; store('px_tok', null); st.d = null; st.role = ''; st.page = '';
  showAuth('ออกจากระบบแล้ว');
}
$('#logoutBtn').addEventListener('click', logout);

// คำแนะนำกฎรหัสผ่าน (มาตรฐาน HIA) — บอกผลขณะพิมพ์ทั้งหน้าสมัครและหน้าบัญชีของฉัน
pwWatch($('#regForm [name=password]'), $('#regPwHint'));
pwWatch($('#pwNew'), $('#pwHint'));

function openPasswordModal(force) {
  openModal('<h3>' + (force ? 'ตั้งรหัสผ่านใหม่' : 'เปลี่ยนรหัสผ่าน') + '</h3><p class="muted small">' + (force ? 'ฝ่ายเลขานุการโครงการกำหนดรหัสผ่านใหม่ให้ท่าน กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน' : '') + '</p>' +
    '<div class="form-grid"><div class="field full"><label>รหัสผ่านปัจจุบัน (ที่ได้รับ)</label><input class="inp" type="password" id="mpOld"></div>' +
    '<div class="field"><label>รหัสผ่านใหม่</label><input class="inp" type="password" id="mpNew"><small class="fhint" id="mpHint"></small></div>' +
    '<div class="field"><label>ยืนยัน</label><input class="inp" type="password" id="mpNew2"></div></div>' +
    '<div class="actions">' + (force ? '' : '<button class="btn" data-close>ยกเลิก</button>') + '<button class="btn primary" id="mpGo">บันทึก</button></div>');
  if (force) $('#modalBg').setAttribute('data-lock', '1');
  pwWatch($('#mpNew'), $('#mpHint'));
  $('#mpGo').onclick = function () {

    if ($('#mpNew').value !== $('#mpNew2').value) return toast('การยืนยันรหัสผ่านไม่ตรงกัน', true);
    var b = this; b.disabled = true;
    call('apiChangePassword', st.token, $('#mpOld').value, $('#mpNew').value).then(function () {
      $('#modalBg').removeAttribute('data-lock'); closeModal(); toast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');
      if (st.d.me) st.d.me.mustChangePw = false;
    }).catch(function (e) { handleErr(e); b.disabled = false; });
  };
}

// ================================================================== ดัชนีการลงเวลา + badge
function buildIndexLite() {
  IX.types = {}; (st.d.types || []).forEach(function (t) { IX.types[t.code] = t; });
  IX.typeOrder = (st.d.types || []).slice().sort(function (a, b) { return (+a.order || 99) - (+b.order || 99); }).map(function (t) { return t.code; });
  IX.hol = {}; (st.d.holidays || []).forEach(function (h) { IX.hol[h.date] = h; });
  IX.people = {}; IX.att = {}; IX.dayRec = {};
}
function buildAttIndex() {
  IX.att = {}; IX.dayRec = {};
  (st.d.attendance || []).forEach(function (r) { IX.att[r.personId + '|' + r.date] = r; });
  (st.d.records || []).forEach(function (r) { (IX.dayRec[r.personId + '|' + r.date] = IX.dayRec[r.personId + '|' + r.date] || []).push(r); });
  IX.eaByMeet = {}; IX.meetById = {};
  (st.d.meetings || []).forEach(function (m) { IX.meetById[m.meetingId] = m; });
  (st.d.eventAtt || []).forEach(function (r) { (IX.eaByMeet[r.meetingId] = IX.eaByMeet[r.meetingId] || []).push(r); });
  // ช่วงเวลาประชุมภายในที่รับรองแล้ว แยกตาม คน|วัน — ใช้บวกเป็นเวลาปฏิบัติงาน
  IX.meetByPD = {};
  var mm = {};
  (st.d.meetings || []).forEach(function (m) {
    if (String(m.scope || '') === 'INTERNAL' && m.status !== 'CERTIFIED') return;
    mm[m.meetingId] = m;
  });
  (st.d.eventAtt || []).forEach(function (r) {
    var m = mm[r.meetingId]; if (!m) return;
    var a = hmOf(r.inAt) || m.startTime, b = hmOf(r.outAt) || m.endTime;
    if (!a || !b || toM(b) <= toM(a)) return;
    var d = m.date || String(r.inAt).slice(0, 10);
    (IX.meetByPD[r.personId + '|' + d] = IX.meetByPD[r.personId + '|' + d] || []).push([toM(a), toM(b)]);
  });
}
/** รวมช่วงเวลาที่ทับกันให้เป็นช่วงเดียว แล้วคืนจำนวนนาทีรวม + นาทีที่อยู่นอกเวลาราชการ */
function mergeSpans(spans, dayStart, dayEnd) {
  if (!spans.length) return { min: 0, out: 0 };
  var a = spans.slice().sort(function (x, y) { return x[0] - y[0]; });
  var out = [a[0].slice()];
  for (var i = 1; i < a.length; i++) {
    var last = out[out.length - 1];
    if (a[i][0] <= last[1]) { if (a[i][1] > last[1]) last[1] = a[i][1]; }
    else out.push(a[i].slice());
  }
  var tot = 0, outside = 0;
  out.forEach(function (sp) {
    tot += sp[1] - sp[0];
    if (dayStart == null) { outside += sp[1] - sp[0]; return; }
    outside += Math.max(0, Math.min(sp[1], dayStart) - sp[0]) + Math.max(0, sp[1] - Math.max(sp[0], dayEnd));
  });
  return { min: tot, out: outside };
}
function updateBadges() {
  buildAttIndex();
  var d = st.d, staff = isStaff();
  var pend = (d.leaveReqs || []).filter(function (q) { return q.status === 'PENDING'; }).length;
  var accP = (d.accounts || []).filter(function (a) { return a.status === 'PENDING'; }).length;
  function set(id, n, on) { var el = $(id); if (!el) return; el.textContent = n; el.classList.toggle('hide', !(on && n)); }
  // Leave รวมสองงานที่เคยอยู่คนละเมนู: ใบลาที่ยังค้าง + รายการที่ต้องตรวจสอบ (สูตรเดิมของ #certBadge และ #reviewBadge)
  var rv = (d.records || []).filter(function (r) { return r.flag === 'REVIEW' || r.type === 'UNSPEC'; }).length +
           ((IX.gaps || []).length);
  set('#leaveBadge', pend + rv, staff);
  set('#userBadge', accP, staff); set('#myLeaveBadge', pend, st.role === 'MEMBER');
  var me = (d.auth && d.auth.personId) || '';
  var intPend = (d.meetings || []).filter(function (m) { return String(m.scope || '') === 'INTERNAL' && m.status === 'PENDING'; });
  set('#intBadge', intPend.length, staff); set('#maBadge', intPend.length, staff);
  set('#meetBadge', intPend.length, staff);
  set('#mmBadge', intPend.filter(function (m) {
    return m.ownerId === me || (d.eventAtt || []).some(function (r) { return r.meetingId === m.meetingId && r.personId === me; });
  }).length, st.role === 'MEMBER');
}

/** สถานะการลงเวลาของคนหนึ่งในวันหนึ่ง */
function dayStatus(p, d) {
  var row = IX.att[p.personId + '|' + d], recs = IX.dayRec[p.personId + '|' + d] || [];
  var full = recs.filter(function (r) { return r.fullDay === 'Y'; })[0];
  var fullOff = full && isOffDuty(full.type);
  var today = st.d.today, past = d < today || (d === today && nowMin() >= toM(workEnd()));
  var o = { row: row, recs: recs, full: full };
  if (row && !isWorkday(d)) {
    o.code = 'EXTRA';              // มาปฏิบัติงานวันนอกรอบ/วันหยุด = ปฏิบัติงานนอกเวลา ไม่นับเป็นวันทำงานหรือมาหลังเวลา
    o.noOut = !row.outAt && d < today;
  } else if (row) {
    o.code = Number(row.lateMin) > 0 ? 'LATE' : 'IN';
    o.noOut = !row.outAt && (d < today || (d === today && nowMin() >= toM(workEnd()) + 60));
  } else if (fullOff) o.code = 'OFFDUTY';
  else if (full) o.code = 'LEAVE';
  else if (!isWorkday(d)) o.code = 'OFF';
  else if (d < clockStart()) o.code = 'NA';
  else if (pendingOffDuty_(p.personId, d)) o.code = 'OFFWAIT';
  else o.code = past ? 'ABSENT' : 'WAIT';
  return o;
}
/** มีใบวันหยุดตามรอบเวรสถานะ PENDING ครอบวันนี้ไหม (ยื่นแบบช่วงวันหรือ dateList) — ดู IX.offWaitPD (ดัชนี personId|date สร้างครั้งเดียวต่อการโหลดใน buildIndex) */
function pendingOffDuty_(personId, d) {
  return !!(IX.offWaitPD && IX.offWaitPD[personId + '|' + d]);
}
var DS_LABEL = { IN: ['มาปฏิบัติงาน', 'good'], LATE: ['มาหลังเวลาที่กำหนด', 'warn'], LEAVE: ['ลา', 'info'], ABSENT: ['ไม่พบการลงเวลา', 'bad'], WAIT: ['ยังไม่ได้ลงเวลา', 'na'], OFF: ['วันหยุด', 'na'], NA: ['–', 'na'],
                OFFDUTY: ['หยุดตามเวร', 'na'], OFFWAIT: ['รอรับรอง', 'info'], EXTRA: ['ปฏิบัติงานนอกวันทำการ', 'info'] };
/**

 * ระบบยังเก็บค่า lateMin/earlyMin ไว้ครบเหมือนเดิม เปลี่ยนเฉพาะการแสดงผล

/** สรุปการลงเวลาของคนหนึ่งในช่วงวันที่ */
function attStats(p, from, to, daily) {
  var w = pWindow(p), s = from > w.s ? from : w.s, e = to < w.e ? to : w.e;
  if (e > st.d.today) e = st.d.today;
  var o = { work: 0, present: 0, late: 0, lateMin: 0, early: 0, earlyMin: 0, noOut: 0, absent: 0, leave: 0, tracked: 0,
            offDuty: 0, inSum: 0, inN: 0, outSum: 0, outN: 0, workMin: 0, clockMin: 0, meetMin: 0, otMin: 0, meetDays: 0 };
  for (var d = s; d <= e; d = addDays(d, 1)) {
    if (!isWorkday(d)) continue;
    var x = dayStatus(p, d);
    if (x.code === 'NA') { if (x.row) o.present++; continue; }
    if (x.code === 'OFFDUTY') { o.offDuty++; continue; }
    o.tracked++;
    var dy = daily ? (daily[d] || (daily[d] = { work: 0, present: 0, leave: 0 })) : null;
    if (x.code === 'OFFWAIT') { o.work++; if (dy) dy.work++; continue; }
    if (x.code === 'LEAVE') { o.leave++; if (dy) dy.leave++; continue; }
    if (x.code === 'WAIT') continue;
    o.work++; if (dy) dy.work++;
    if (x.row) {
      o.present++; if (dy) dy.present++;
      if (Number(x.row.lateMin) > 0) { o.late++; o.lateMin += Number(x.row.lateMin); }
      if (Number(x.row.earlyMin) > 0) { o.early++; o.earlyMin += Number(x.row.earlyMin); }
      if (x.noOut) o.noOut++;
      var hi = hmOf(x.row.inAt); if (hi) { o.inSum += toM(hi); o.inN++; }
      var ho = hmOf(x.row.outAt); if (ho) { o.outSum += toM(ho); o.outN++; }
      if (hi && ho && toM(ho) > toM(hi)) o.clockMin += toM(ho) - toM(hi);
    } else if (x.code === 'ABSENT') o.absent++;
  }
  // เวลาปฏิบัติงาน = ช่วงที่ลงเวลามา-กลับ รวมกับช่วงประชุมภายในที่รับรองแล้ว (ช่วงที่ทับกันนับครั้งเดียว)
  var ws = toM(workStart()), we = toM(workEnd());
  for (var dd = s; dd <= e; dd = addDays(dd, 1)) {
    var rowD = IX.att[p.personId + '|' + dd], mts = IX.meetByPD[p.personId + '|' + dd] || [];
    var spans = mts.slice();
    var ai = rowD && hmOf(rowD.inAt), ao = rowD && hmOf(rowD.outAt);
    if (ai && ao && toM(ao) > toM(ai)) spans.push([toM(ai), toM(ao)]);
    if (!spans.length) continue;
    if (mts.length) o.meetDays++;
    var wd2 = isWorkday(dd);
    var mg = mergeSpans(spans, wd2 ? ws : null, wd2 ? we : null);
    o.workMin += mg.min;
    o.otMin += mg.out;
    o.meetMin += mergeSpans(mts, null, null).min;
  }
  o.onTime = o.work ? (o.present - o.late) / o.work : null;
  o.rate = o.work ? o.present / o.work : null;
  o.inAvg = o.inN ? minToHm(Math.round(o.inSum / o.inN)) : '';
  o.outAvg = o.outN ? minToHm(Math.round(o.outSum / o.outN)) : '';
  return o;
}
function minToHm(m) { m = Math.max(0, m); return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
function attCells(o) {
  if (!o.tracked && !o.present) return '<td class="r muted" colspan="7">ยังไม่ใช้ระบบลงเวลา</td>';

  var last = seeLate() ? o.onTime : o.rate;

      }, function (e) {

// ------------------------------------------------------------------ เอกสารสรุปการประชุม (ลิงก์ Google Workspace)
var DOC_MAX = 10;
var DOC_KIND = { document: ['Docs', '#2563eb'], spreadsheets: ['Sheets', '#16a34a'], presentation: ['Slides', '#d97706'],
  forms: ['Forms', '#7c3aed'], drawings: ['Drawings', '#dc2626'], folder: ['โฟลเดอร์', '#475569'], file: ['Drive', '#0f766e'] };
var DOC_ACC = { LINK: ['เปิดได้ทุกคนที่มีลิงก์', 'good'], DOMAIN: ['เปิดได้เฉพาะคนในองค์กร', 'good'],
  PRIVATE: ['⚠ จำกัดสิทธิ์ — เฉพาะคนที่ได้รับแชร์', 'warn'], UNKNOWN: ['⚠ ตรวจสิทธิ์ไม่ได้', 'warn'] };
function meetDocs(m) {
  if (!m || !m.docs) return [];
  try { var a = JSON.parse(m.docs); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function docNeedsCheck(d) { return d.access === 'PRIVATE' || d.access === 'UNKNOWN'; }
/** ตรวจฝั่งหน้าเว็บก่อนส่ง (เซิร์ฟเวอร์ตรวจซ้ำอีกชั้น) */
function docUrlOk(u) { return /^https:\/\/(docs|drive)\.google\.com\/\S*(\/d\/|folders\/|[?&]id=)[\w-]{15,}/i.test(String(u || '').trim()); }
function docKindOf(u) {
  var k = /google\.com\/(document|spreadsheets|presentation|forms|drawings)\//i.exec(u);
  if (k) return k[1].toLowerCase();
  return /folders\//i.test(u) ? 'folder' : 'file';
}
function docChip(kind) {
  var k = DOC_KIND[kind] || DOC_KIND.file;
  return '<span class="doc-kind" style="background:' + k[1] + '">' + esc(k[0]) + '</span>';
}
/** ผู้ใช้คนนี้แนบ/แก้ลิงก์ของวงนี้ได้ไหม (เซิร์ฟเวอร์ตรวจอีกชั้น) */
function canEditDocs(m) {
  if (!m || m.status === 'CANCELLED') return false;
  if (isStaff()) return true;
  var me = myPersonId();
  return !!me && (m.ownerId === me || meetPeopleOf(m.meetingId).indexOf(me) !== -1);
}
/** ช่องในตาราง: จำนวนลิงก์ + เตือนถ้ามีไฟล์ที่ต้องตรวจสิทธิ์ */
function docsCell(m, allowEdit) {
  var ds = meetDocs(m), warn = ds.filter(docNeedsCheck).length;
  if (!ds.length && m.docsCount) return '<span class="muted small">' + m.docsCount + ' ไฟล์</span>';
  if (!ds.length) {
    return allowEdit && canEditDocs(m) ? '<button class="btn sm" data-docs="' + m.meetingId + '">+ แนบลิงก์</button>' : '<span class="muted small">ยังไม่มี</span>';
  }
  return '<button class="btn sm doc-btn' + (warn ? ' warn' : '') + '" data-docs="' + m.meetingId + '">📎 ' + ds.length + ' ไฟล์' +
    (warn ? ' · ⚠ ' + warn : '') + '</button>';
}
function docListHtml(ds) {
  if (!ds.length) return '<div class="empty" style="padding:18px">ยังไม่มีเอกสารสรุป</div>';
  return '<div class="doc-list">' + ds.map(function (d) {
    var a = DOC_ACC[d.access] || DOC_ACC.UNKNOWN;
    return '<div class="doc-item">' + docChip(d.kind) +
      '<div class="doc-main"><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.title || d.url) + '</a>' +
      '<div class="muted small">' + pill(a[0], a[1]) + ' · แนบโดย ' + esc(d.addedBy || '-') + (d.addedAt ? ' · ' + thDate(String(d.addedAt).slice(0, 10)) : '') + '</div></div></div>';
  }).join('') + '</div>';
}
function docRowHtml(d) {
  d = d || {};
  return '<div class="doc-edit"><div class="doc-edit-f">' +
    '<input class="inp" data-f="url" placeholder="https://docs.google.com/document/d/…" value="' + esc(d.url || '') + '">' +
    '<input class="inp" data-f="title" maxlength="150" placeholder="ชื่อเอกสาร (เว้นว่าง = ใช้ชื่อไฟล์จาก Drive)" value="' + esc(d.title || '') + '">' +
    '</div><button class="btn sm danger" data-doc-del title="นำออก">✕</button></div>';
}
/** เปิดดู/แก้ไขลิงก์เอกสารของวงหนึ่ง · after = ทำต่อหลังบันทึก (ใช้ในหน้าบริหาร) */
function openMeetDocs(m, after) {
  var ds = meetDocs(m), edit = canEditDocs(m);
  var head = '<h3>เอกสารสรุปการประชุม</h3><p class="muted small">' + esc(m.topic) + ' · ' + thDate(m.date) + ' · ' + esc(m.startTime + '–' + m.endTime) + ' น.</p>';
  if (!edit) {
    openModal(head + '<div style="margin-top:12px">' + docListHtml(ds) + '</div><div class="actions"><button class="btn primary" data-close>ปิด</button></div>');
    return;
  }
  var warn = ds.filter(docNeedsCheck);
  openModal(head +
    (ds.length ? '<div style="margin-top:12px">' + docListHtml(ds) + '</div>' : '') +
    (warn.length ? '<div class="note warn small" style="margin-top:10px">มี ' + warn.length + ' ไฟล์ที่ผู้เข้าร่วมอาจเปิดไม่ได้ · เปิดไฟล์ใน Google Drive › แชร์ › ตั้งค่าเป็น "ทุกคนในองค์กรที่มีลิงก์" หรือ "ทุกคนที่มีลิงก์" แล้วกลับมาเลือกบันทึกอีกครั้งเพื่อตรวจใหม่</div>' : '') +
    '<h4 style="margin:18px 0 6px">แก้ไขรายการลิงก์</h4>' +
    '<p class="muted small" style="margin:0 0 8px">รับเฉพาะลิงก์ Google Docs · Sheets · Slides · Forms · Drive ไม่เกิน ' + DOC_MAX + ' ลิงก์ · ระบบจะตรวจการแชร์ให้หลังบันทึก</p>' +
    '<div id="docRows">' + (ds.length ? ds.map(docRowHtml).join('') : docRowHtml()) + '</div>' +
    '<button class="btn sm" id="docAdd" style="margin-top:6px">+ เพิ่มลิงก์</button>' +
    '<h4 style="margin:18px 0 6px">หรืออัปโหลดไฟล์เอกสาร</h4>' +
    '<p class="muted small" style="margin:0 0 8px">ไม่ต้องแชร์สิทธิ์ก็เปิดได้ เพราะไฟล์ถูกเก็บไว้ในระบบเอง</p>' +
    attachBoxHtml('meetAttach') +
    '<div class="actions"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="docSave">บันทึกเอกสาร</button></div>');
  wireAttachBox('meetAttach', 'MEET', m.meetingId);
  var rows = $('#docRows');
  function syncAdd() { $('#docAdd').disabled = rows.children.length >= DOC_MAX; }
  syncAdd();
  $('#docAdd').onclick = function () { rows.insertAdjacentHTML('beforeend', docRowHtml()); syncAdd(); rows.lastElementChild.querySelector('input').focus(); };
  rows.addEventListener('click', function (e) {
    var b = e.target.closest('[data-doc-del]'); if (!b) return;
    b.closest('.doc-edit').remove(); if (!rows.children.length) rows.insertAdjacentHTML('beforeend', docRowHtml()); syncAdd();
  });
  rows.addEventListener('input', function (e) {

  });
  $('#docSave').onclick = function () {
    var btn = this, bad = 0;

      var u = r.querySelector('[data-f=url]').value.trim(), t = r.querySelector('[data-f=title]').value.trim();
      if (u && !docUrlOk(u)) { bad++; r.querySelector('[data-f=url]').classList.add('bad'); }
      return { url: u, title: t };
    }).filter(function (x) { return x.url; });
    if (bad) return toast('มี ' + bad + ' ลิงก์ที่ไม่ใช่ลิงก์ Google Docs / Sheets / Slides / Drive', true);
    btn.disabled = true;
    call('apiMeetDocs', st.token, m.meetingId, list).then(function (res) {
      var w = meetDocs(res).filter(docNeedsCheck).length;

      return load(true);
    }).then(function () { if (after) after(); }).catch(function (e) { btn.disabled = false; handleErr(e); });
  };
}

// ================================================================== จุดลงเวลา (สแกนรหัส QR)
var SC = { mode: store('px_st_mode') || 'DAY', meetingId: store('px_st_meet') || '', state: null, timer: null, stream: null,
  loop: null, detector: null, lastText: '', lastAt: 0, busy: false, recent: [] };
RENDER.station = function () {

var RM = { tab: store('px_st_tab') || 'room', dir: '', cur: null, t0: 0, lastFetch: 0, fetching: false, shown: '', full: false, tick: null, busy: false };
function roomTarget() { return SC.mode === 'EVENT' ? { target: 'EVENT', meetingId: SC.meetingId || '' } : { target: 'DAY', meetingId: '' }; }

/** หลังรีเฟรชหน้า/สลับโหมด: แสดงรอบที่ยังเปิดอยู่ของเป้าหมายนี้ต่อ */

function roomTick() {
  if (st.page !== 'station' || RM.tab !== 'room' || !RM.cur || !RM.cur.window || !RM.cur.window.open) return;
  var el = Date.now() - RM.t0, c = RM.cur;
  var qrLeft = Math.max(0, Math.ceil(c.nextInSec - el / 1000)), pinLeft = Math.max(0, Math.ceil(c.pinNextInSec - el / 1000));
  var winLeft = Math.max(0, Math.ceil(c.window.secondsLeft - el / 1000));
  var ring = $('#rmRing'), C = 2 * Math.PI * 15.5;
  if (ring) ring.style.strokeDashoffset = C * (1 - qrLeft / c.step);
  if ($('#rmLeft')) $('#rmLeft').textContent = 'QR ใหม่ใน ' + qrLeft + ' วิ';
  if ($('#rmPinLeft')) $('#rmPinLeft').textContent = 'เปลี่ยนใน ' + pinLeft + ' วิ';
  if ($('#rmClose')) {
    var h = Math.floor(winLeft / 3600), m = Math.floor(winLeft % 3600 / 60), s = winLeft % 60;
    $('#rmClose').textContent = (h ? h + ':' + pad(m) : m) + ':' + pad(s);
    $('#rmClose').classList.toggle('t-warn', winLeft <= 120);
  }
  if (!RM.fetching && (qrLeft === 0 || pinLeft === 0 || winLeft === 0 || Date.now() - RM.lastFetch > 15000)) roomFetch(c.window.winId);
}

function roomFetch(winId) {
  if (RM.fetching) return;
  RM.fetching = true; RM.lastFetch = Date.now();
  call('apiRoomQr', st.token, winId).then(roomApply).catch(function (e) {
    if (e.code === 'AUTH') return handleErr(e);
    if (e.code === 'NO_WINDOW') { RM.cur = null; renderRoomBox(); }
    // เน็ตหลุดชั่วคราว: คง QR เดิมไว้ ลองใหม่รอบหน้า
  }).then(function () { RM.fetching = false; });
}

function roomApply(r) {
  if (r.state) { SC.state = r.state; renderStation(); }
  if (r.closed || !r.window || !r.window.open) {
    if (RM.cur && r.window && RM.cur.window.winId === r.window.winId) toast(r.message || 'ปิดรับสแกนแล้ว');
    RM.cur = null; roomFull(false); renderRoomBox(); return;
  }
  RM.cur = r; RM.t0 = Date.now(); RM.lastFetch = Date.now();

$('#roomBox').addEventListener('click', function (e) {

function handleCode(text) {
  text = String(text || '').trim();
  if (!text) return;
  var now = Date.now();
  if (text === SC.lastText && now - SC.lastAt < 5000) return;      // กล้องอ่าน QR ใบเดิมซ้ำ ๆ
  if (SC.busy) return;
  SC.lastText = text; SC.lastAt = now; SC.busy = true;
  if (SC.mode === 'EVENT' && !SC.meetingId) { SC.busy = false; return scanShow({ error: 'เลือกประชุม/อบรมก่อนสแกน' }); }
  scanShow({ pending: true });
  call('apiScan', st.token, text, { mode: SC.mode, meetingId: SC.meetingId }).then(function (r) {
    var s = SC.state;
    if (s && r.att) { var i = s.attendance.findIndex(function (x) { return x.attId === r.att.attId; }); if (i >= 0) s.attendance[i] = r.att; else s.attendance.push(r.att); SC.flashId = r.att.attId; }
    if (s && r.ea) { s.eventAtt = s.eventAtt || []; var j = s.eventAtt.findIndex(function (x) { return x.eaId === r.ea.eaId; }); if (j >= 0) s.eventAtt[j] = r.ea; else s.eventAtt.push(r.ea); }
    if (r.att && st.d.attendance && isStaff()) { var k = st.d.attendance.findIndex(function (x) { return x.attId === r.att.attId; }); if (k >= 0) st.d.attendance[k] = r.att; else st.d.attendance.push(r.att); buildAttIndex(); }
    scanShow(r); beep(r.action === 'DUP' ? 'dup' : 'ok'); renderStation();
  }).catch(function (e) {
    if (e.code === 'AUTH') return handleErr(e);
    scanShow({ error: e.message }); beep('err');
  }).then(function () { SC.busy = false; if (!isTouch() && !SC.stream) $('#scanInput').focus(); });
}
function scanShow(r) {

  else {

    var tagTxt = { IN: SC.mode === 'EVENT' ? 'ลงชื่อเข้าร่วม' : 'มาปฏิบัติงาน', OUT: SC.mode === 'EVENT' ? 'ลงชื่อออก' : 'กลับ', DUP: 'สแกนซ้ำ' }[r.action];

var AC = null;
function beep(kind) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = kind === 'ok' ? 880 : kind === 'dup' ? 660 : 220; o.type = 'sine';
    g.gain.setValueAtTime(0.18, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (kind === 'err' ? 0.5 : 0.18));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.5);
    // สั่นได้เฉพาะหลังผู้ใช้แตะหน้าจอแล้ว (หน้าที่เปิดจากการสแกนยังไม่มีการแตะ)
    if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(kind === 'err' ? [80, 60, 80] : 60);
  } catch (e) { /* ไม่มีเสียง */ }
}

// ---- กล้อง: BarcodeDetector (Chrome/Android) หรือ jsQR (โหลดเมื่อจำเป็น)
function loadJsQr() {
  if (window.jsQR) return Promise.resolve();
  return new Promise(function (res, rej) {
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    sc.onload = function () { res(); }; sc.onerror = function () { rej(new Error('โหลดตัวอ่าน QR ไม่ได้')); };
    document.head.appendChild(sc);
  });
}
function camStart() {
  var idle = $('#camIdle');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail('เบราว์เซอร์นี้เปิดกล้องในหน้าเว็บไม่ได้');
  idle.innerHTML = '<div class="spin"></div><p class="small">กำลังเปิดกล้อง…</p>';
  var getDetector = ('BarcodeDetector' in window) ? window.BarcodeDetector.getSupportedFormats().then(function (f) {
    return f.indexOf('qr_code') !== -1 ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null;
  }).catch(function () { return null; }) : Promise.resolve(null);
  getDetector.then(function (det) {
    SC.detector = det;
    return (det ? Promise.resolve() : loadJsQr()).then(function () {
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    });
  }).then(function (stream) {

    $('#cam').classList.add('live'); idle.classList.add('hide');
    camLoop();
  }).catch(function (e) {
    camFail(e && e.name === 'NotAllowedError' ? 'ไม่ได้รับอนุญาตให้ใช้กล้อง' : (e && e.message) || 'เปิดกล้องไม่ได้');
  });
}
function camFail(msg) {
  var idle = $('#camIdle'); idle.classList.remove('hide');
  idle.innerHTML = '<p><b>' + esc(msg) + '</b></p><p class="small">ทางเลือก: ใช้<b>แอปพลิเคชันกล้อง</b>ของเครื่องนี้สแกนรหัส QR (ระบบจะเปิดหน้านี้และบันทึกให้) · หรือเสียบเครื่องสแกนแล้วคลิกช่องด้านล่าง</p>' +
    '<button class="btn primary" id="camRetry">ลองอีกครั้ง</button>';
  $('#camRetry').onclick = camStart;
}
function camLoop() {
  var v = $('#camVideo'), cv = SC.canvas || (SC.canvas = document.createElement('canvas')), g = cv.getContext('2d', { willReadFrequently: true });
  clearInterval(SC.loop);
  SC.loop = setInterval(function () {
    if (!SC.stream || v.readyState < 2 || SC.busy) return;
    if (SC.detector) {
      SC.detector.detect(v).then(function (codes) { if (codes && codes[0]) handleCode(codes[0].rawValue); }).catch(function () {});
      return;
    }
    if (!window.jsQR) return;
    var w = Math.min(720, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
    if (!w || !h) return;
    cv.width = w; cv.height = h; g.drawImage(v, 0, 0, w, h);
    var img = g.getImageData(0, 0, w, h), code = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (code && code.data) handleCode(code.data);

}
function camStop() {
  clearInterval(SC.loop); SC.loop = null;
  if (SC.stream) { SC.stream.getTracks().forEach(function (t) { t.stop(); }); SC.stream = null; }
  var c = $('#cam'); if (c) c.classList.remove('live');
  var idle = $('#camIdle');
  if (idle) { idle.classList.remove('hide'); idle.innerHTML = '<button class="btn primary" id="camStart2">เปิดกล้องสแกน</button><p class="small">หรือใช้เครื่องสแกนบาร์โค้ด หรือแอปพลิเคชันกล้องของเครื่องนี้สแกน</p>'; $('#camStart2').onclick = camStart; }

function renderPersonAttendance(p, fy) {
  var months = fyMonths(fy), fr = rangeOfMonths(months);
  if (clockStart() > fr.to && !(st.d.attendance || []).some(function (r) { return r.personId === p.personId && r.date >= fr.from && r.date <= fr.to; })) {
    $('#pAttendance').innerHTML = '<div class="empty">เริ่มใช้ระบบลงเวลา ' + thDate(clockStart()) + ' — ยังไม่มีข้อมูลในปีงบประมาณนี้</div>'; return;
  }
  var tot = { work: 0, present: 0, late: 0, lateMin: 0, early: 0, earlyMin: 0, noOut: 0, absent: 0, leave: 0, tracked: 0 };
  var body = months.map(function (m) {
    var r = rangeOfMonths([m]);
    if (r.from > st.d.today) return '<tr><td>' + thMonth(m, true) + '</td><td colspan="7" class="muted small r">ยังไม่ถึง</td></tr>';
    var o = attStats(p, r.from, r.to);
    for (var k in tot) tot[k] += o[k] || 0;
    return '<tr><td>' + thMonth(m, true) + '</td>' + attCells(o) + '</tr>';
  }).join('');
  tot.onTime = tot.work ? (tot.present - tot.late) / tot.work : null;
  var ev = (st.d.eventAtt || []).filter(function (r) { return r.personId === p.personId && fyOf(String(r.inAt).slice(0, 10)) === fy; }).length;
  $('#pAttSub').textContent = 'จากการสแกนรหัส QR · เริ่มนับ ' + thDate(clockStart()) + ' · ลงชื่อเข้าร่วมประชุม/อบรม ' + ev + ' ครั้งในปีงบประมาณนี้';
  $('#pAttendance').innerHTML = '<table class="tbl"><thead><tr><th>เดือน</th>' + attHead() + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr><td>' + fyLabel(fy) + '</td>' + attCells(tot) + '</tr></tfoot></table>';
}

/**
 * เส้นทางจากลิงก์ที่เปิดหน้าเว็บ (?p=scan&c=… หรือ ?p=ci&w=…)
 *   ใน Apps Script: doGet ฝัง ROUTE มาให้แล้ว
 *   บน GitHub Pages: ROUTE = null → อ่านจาก URL เอง · QR หน้าห้องส่งไปตรวจที่ apiRoomRoute (16_Http.gs)
 *   แล้วลบ ?… ออกจากแถบที่อยู่ เพื่อไม่ให้กดรีเฟรชแล้วใช้ QR เดิมซ้ำ
 */
function bootRoute(next) {
  if (typeof ROUTE !== 'undefined' && ROUTE) return next();
  var q = {};
  try { new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); } catch (e) { /* - */ }
  var p = String(q.p || '').slice(0, 20);
  function done() {
    try { if (location.search) history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* - */ }
    next();
  }
  if (p === 'ci') {
    ROUTE = { p: 'ci', pending: true };
    call('apiRoomRoute', { w: q.w, t: q.t, n: q.n, s: q.s })
      .then(function (r) { ROUTE = r || { p: 'ci', err: 'ตรวจ QR ไม่สำเร็จ', code: 'ERR' }; })
      .catch(function (e) { ROUTE = { p: 'ci', err: e && e.message || String(e), code: e && e.code || 'ERR' }; })
      .then(done);
    return;
  }
  ROUTE = { p: p, c: String(q.c || '').slice(0, 200) };
  done();
}

  $('#myLvList').innerHTML = rows.length ? '<div class="my-lv-list">' + rows.map(function (o) {
    var x = o.x;
    var time = x.fullDay === 'Y' ? 'เต็มวัน' : (x.startTime ? x.startTime + '–' + x.endTime + ' น.' : hm(+x.minutes || 0));
    var lead = o.lead == null ? '' : (o.lead < 0 ? '<span class="t-bad">ยื่นย้อนหลัง ' + (-o.lead) + ' วัน</span>' : 'ยื่นล่วงหน้า ' + o.lead + ' วัน');
    return '<div class="my-lv-item">' +
      '<div class="my-lv-top"><b>' + thDate(x.date) + '</b> <span class="muted small">' + TH_WD[wd(x.date)] + '</span>' +
        '<span class="my-lv-hrs num">' + hrs(recMin(x), false) + ' ชม.</span></div>' +
      '<div class="my-lv-mid">' + tag(x.type) + ' <span class="small">' + esc(time) + '</span></div>' +
      '<div class="my-lv-meta muted small">' + [o.sub ? 'ยื่นเมื่อ ' + thDate(o.sub) : '', lead, x.checkedBy || (o.q && o.q.decidedBy) ? 'ผู้รับรอง ' + esc(x.checkedBy || o.q.decidedBy) : ''].filter(Boolean).join(' · ') + '</div>' +
      (x.reason ? '<div class="my-lv-reason small">' + esc(x.reason) + '</div>' : '') +
    '</div>';
  }).join('') + '</div>' : '<div class="empty">ไม่มีรายการลาใน' + esc(r.label) + '</div>';
}
$('#myLvType').addEventListener('change', function (e) { MY.lvType = e.target.value; myLeaveRender(); });

// ---------------------------------------------------------------- รายงานของฉัน
function myRepRange() {
  var t = st.d.today, k = MY.rq, r;
  if (k === 'month') { r = rangeOfMonths([ym(t)]); r.label = thMonth(ym(t), true); }
  else if (k === 'prev') {
    var y = +t.slice(0, 4), m = +t.slice(5, 7) - 1; if (m < 1) { m = 12; y--; }
    var pm = y + '-' + pad(m); r = rangeOfMonths([pm]); r.label = thMonth(pm, true);
  } else if (k === 'quarter') {
    var fy = fyOf(t), q = qOf(t), ms = fyMonths(fy).slice((q - 1) * 3, q * 3);
    r = rangeOfMonths(ms); r.label = 'ไตรมาส ' + q + ' ' + fyLabel(fy) + ' (' + thMonth(ms[0]) + ' – ' + thMonth(ms[2]) + ')';
  } else if (k === 'custom') {
    var f = MY.from || ym(t) + '-01', to = MY.to || t;
    if (to < f) { var z = f; f = to; to = z; }
    var months = [], cur = ym(f);
    while (cur <= ym(to)) { months.push(cur); var yy = +cur.slice(0, 4), mm = +cur.slice(5, 7) + 1; if (mm > 12) { mm = 1; yy++; } cur = yy + '-' + pad(mm); }
    r = { from: f, to: to, months: months, label: thDate(f) + ' – ' + thDate(to) };
  } else { r = myFyRange(); r.label = fyLabel(r.fy) + ' (' + thMonth(r.months[0]) + ' – ' + thMonth(r.months[11]) + ')'; }
  return r;
}
function myRepRender() {
  var p = IX.people[st.personId]; if (!p) return;
  $$('#myRepQuick [data-mq]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-mq') === MY.rq); });
  $('#myRepCustom').classList.toggle('hide', MY.rq !== 'custom');
  var r = myRepRange();
  if (MY.rq === 'custom') { $('#myRepFrom').value = r.from; $('#myRepTo').value = r.to; $('#myRepFrom').max = $('#myRepTo').max = st.d.today; }
  $('#myRepSub').textContent = r.label + (MY.rq === 'fy' ? ' · เปลี่ยนปีงบประมาณได้ที่ช่องด้านบน' : '');
  $('#myRepDoc').innerHTML = formalReport(reportPersonHtml(p.personId, r));
}
$('#myRepQuick').addEventListener('click', function (e) {
  var b = e.target.closest('[data-mq]'); if (!b) return;
  MY.rq = b.getAttribute('data-mq'); myRepRender();
});
['#myRepFrom', '#myRepTo'].forEach(function (id) {
  $(id).addEventListener('change', function () { MY.from = $('#myRepFrom').value; MY.to = $('#myRepTo').value; myRepRender(); });
});
$('#myRepPdf').addEventListener('click', function () {
  myRepRender();
  var pg = $('#page-person'); pg.classList.add('print-on');
  setTimeout(function () { window.print(); pg.classList.remove('print-on'); }, 50);
});
</script>
