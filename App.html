function openModal(html) { $('#modal').className = 'modal'; $('#modal').innerHTML = html; $('#modalBg').classList.add('on'); var f = $('#modal input,#modal select'); if (f) setTimeout(function () { f.focus(); }, 30); }
function closeModal() { $('#modalBg').classList.remove('on'); $('#modal').innerHTML = ''; }

$('#nav').addEventListener('click', function (e) { var b = e.target.closest('[data-page]'); if (b) go(b.getAttribute('data-page')); });
// แถบเมนูบน: เลื่อนด้วยลูกกลิ้งเมาส์ (แนวตั้ง -> แนวนอน) + ลากด้วยเมาส์ + ไล่สีขอบบอกว่ายังเลื่อนได้อีก
(function () {
  var nav = $('#nav'), wrap = $('#navWrap');
  if (!nav || !wrap) return;
  function syncFade() {
    wrap.classList.toggle('ov-l', nav.scrollLeft > 2);
    wrap.classList.toggle('ov-r', nav.scrollLeft < nav.scrollWidth - nav.clientWidth - 2);
  }
  nav.addEventListener('scroll', syncFade);
  window.addEventListener('resize', syncFade);
  nav.addEventListener('wheel', function (e) {
    if (nav.scrollWidth <= nav.clientWidth) return;
    var dx = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!dx) return;
    e.preventDefault();
    nav.scrollLeft += dx;
  }, { passive: false });
  var drag = null;
  nav.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return; // ให้คลิกปุ่มทำงานปกติ ไม่เริ่มลาก
    drag = { x: e.clientX, sl: nav.scrollLeft, moved: false };
    nav.setPointerCapture(e.pointerId);
  });
  nav.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var d = e.clientX - drag.x;
    if (Math.abs(d) > 3) { drag.moved = true; nav.classList.add('dragging'); }
    nav.scrollLeft = drag.sl - d;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    nav.addEventListener(ev, function () { drag = null; nav.classList.remove('dragging'); });
  });
  var mo = new MutationObserver(syncFade);
  mo.observe(nav, { attributes: true, attributeFilter: ['class'] });
  setTimeout(syncFade, 0);
  window.syncNavFade = syncFade;
})();

      if (nt === null) return;
      job = call('apiMeetReopen', st.token, m.meetingId, nt).then(done('ย้อนเป็นรอรับรองแล้ว'));
    } else if (a === 'check') {
      job = call('apiMeetDocsCheck', st.token, m.meetingId).then(function (res) {

      });

      job = call('apiMeetCancel', st.token, m.meetingId).then(done('ยกเลิกแล้ว'));
    }
    if (job) { b.disabled = true; job.catch(function (err) { b.disabled = false; handleErr(err); }); }
  });

// ================================================================== ช่องเวลา 24 ชม. (แทน input type=time ที่เบราว์เซอร์บางเครื่องแสดง AM/PM)
//   แปลงทุก <input type="time"> เป็นดรอปดาวน์ ชม. 00–23 + นาที (ทีละ 5) โดยอัตโนมัติ
//   ช่องเดิมยังอยู่ (เปลี่ยนเป็น hidden) ชื่อ/id/data-* เหมือนเดิม → โค้ดที่อ่าน .value / ตั้ง .hidden ใช้ได้ตามเดิม
var T24_STEP = 5;
function t24Pad(n) { return (n < 10 ? '0' : '') + n; }
function t24Sync(inp) {
  var w = inp._t24; if (!w) return;
  var v = /^(\d{1,2}):(\d{2})/.exec(inp.value || '');
  var h = w.querySelector('[data-t24=h]'), m = w.querySelector('[data-t24=m]');
  if (!v) { h.value = ''; m.value = ''; return; }
  var hh = t24Pad(+v[1]), mm = v[2];
  if (!m.querySelector('option[value="' + mm + '"]')) {          // นาทีที่ไม่ลงตัว 5 (เช่น เวลาที่สแกนจริง) ใส่เพิ่มให้ ไม่ปัดทิ้ง
    var o = document.createElement('option'); o.value = mm; o.textContent = mm;
    var after = Array.prototype.filter.call(m.options, function (x) { return x.value && x.value > mm; })[0];
    m.insertBefore(o, after || null);
  }
  h.value = hh; m.value = mm;
}
function t24Upgrade(inp) {
  if (inp._t24) return;
  var desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  var opt = '<option value="">--</option>';
  var hs = opt, ms = opt;
  for (var i = 0; i < 24; i++) hs += '<option value="' + t24Pad(i) + '">' + t24Pad(i) + '</option>';
  for (var j = 0; j < 60; j += T24_STEP) ms += '<option value="' + t24Pad(j) + '">' + t24Pad(j) + '</option>';
  var w = document.createElement('span');
  w.className = 't24';
  w.innerHTML = '<select class="inp" data-t24="h" aria-label="ชั่วโมง">' + hs + '</select><b>:</b>' +
                '<select class="inp" data-t24="m" aria-label="นาที">' + ms + '</select><span class="t24-u">น.</span>';
  if (inp.style.width) w.style.minWidth = inp.style.width;
  w.hidden = inp.hidden;
  inp.parentNode.insertBefore(w, inp);
  w.appendChild(inp);
  inp.type = 'hidden';
  inp._t24 = w;
  // ตั้ง .value จากโค้ด → ดรอปดาวน์ตามด้วย
  Object.defineProperty(inp, 'value', {
    configurable: true,
    get: function () { return desc.get.call(this); },
    set: function (v) { desc.set.call(this, v); t24Sync(this); }
  });
  // ตั้ง .hidden ที่ช่องเดิม → ซ่อน/แสดงทั้งกลุ่ม
  new MutationObserver(function () { w.hidden = inp.hidden; }).observe(inp, { attributes: true, attributeFilter: ['hidden'] });
  w.addEventListener('change', function (e) {
    if (!e.target.hasAttribute('data-t24')) return;
    e.stopPropagation();
    var h = w.querySelector('[data-t24=h]'), m = w.querySelector('[data-t24=m]');
    if (h.value && !m.value) m.value = '00';
    if (!h.value && m.value) m.value = '';
    desc.set.call(inp, h.value ? h.value + ':' + m.value : '');
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
  });
  t24Sync(inp);
}
function t24Scan(root) {
  if (!root || !root.querySelectorAll) return;
  if (root.matches && root.matches('input[type=time]')) t24Upgrade(root);
  Array.prototype.forEach.call(root.querySelectorAll('input[type=time]'), t24Upgrade);
}
t24Scan(document.body);
new MutationObserver(function (ms) {
  ms.forEach(function (m) { Array.prototype.forEach.call(m.addedNodes, function (n) { if (n.nodeType === 1) t24Scan(n); }); });
}).observe(document.body, { childList: true, subtree: true });


/**
 * ช่องช่วงเวลา 1 แถว: [เริ่ม] → [สิ้นสุด]  · รวม x ชม. y นาที
 * o = { label, a:'name="startTime"', av, b:'name="endTime"', bv, show?, from?, to?, note? }
 */
function timeRange(o) {
  return '<div class="field full"' + (o.show ? ' data-show="' + o.show + '"' : '') + '><label>' + esc(o.label) + '</label>' +
    '<div class="trange">' +
      '<div class="trange-end"><span class="trange-cap">' + esc(o.from || 'เริ่ม') + '</span><input class="inp" type="time" ' + o.a + ' value="' + esc(o.av || '') + '"></div>' +
      '<span class="trange-arrow" aria-hidden="true">→</span>' +
      '<div class="trange-end"><span class="trange-cap">' + esc(o.to || 'สิ้นสุด') + '</span><input class="inp" type="time" ' + o.b + ' value="' + esc(o.bv || '') + '"></div>' +
      '<span class="trange-dur"></span>' +
    '</div>' + (o.note ? '<span class="muted small">' + esc(o.note) + '</span>' : '') + '</div>';
}
function trangeUpd(box) {
  var ins = box.querySelectorAll('input[type=hidden],input[type=time]'), out = box.querySelector('.trange-dur');
  if (ins.length < 2 || !out) return;
  var a = ins[0].value, b = ins[1].value;
  if (!a || !b) { out.textContent = ''; out.className = 'trange-dur'; return; }
  var d = toMin(b) - toMin(a);
  if (d <= 0) { out.textContent = 'เวลาสิ้นสุดต้องหลังเวลาเริ่ม'; out.className = 'trange-dur bad'; return; }
  out.textContent = 'รวม ' + (Math.floor(d / 60) ? Math.floor(d / 60) + ' ชม. ' : '') + (d % 60 ? d % 60 + ' นาที' : '');
  out.className = 'trange-dur';
}
document.addEventListener('change', function (e) { var b = e.target.closest && e.target.closest('.trange'); if (b) trangeUpd(b); });
new MutationObserver(function () { $$('.trange').forEach(function (b) { if (!b._tr) { b._tr = 1; trangeUpd(b); } }); })
  .observe(document.body, { childList: true, subtree: true });
