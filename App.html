<script>

// กฎรหัสผ่านตามมาตรฐาน HIA — ต้องตรงกับ PW_RULE_TXT ใน 01_Config.gs
var PW_RULE = 'ต้องมีทั้งตัวอักษรและตัวเลข รวมกันอย่างน้อย 8 หลัก ตามมาตรฐาน HIA';
/** คืนข้อความผิดพลาด หรือ '' เมื่อรหัสผ่านผ่านเกณฑ์ */
function pwBad(pw) {
  pw = String(pw || '');
  if (pw.length < 8 || !/[A-Za-z\u0e00-\u0e7f]/.test(pw) || !/\d/.test(pw)) return 'รหัสผ่าน' + PW_RULE;
  return '';
}
/** ติดคำแนะนำใต้ช่องรหัสผ่าน แล้วบอกผล ผ่าน/ยังไม่ผ่าน ขณะพิมพ์ */
function pwWatch(inp, hint) {
  if (!inp || !hint) return;
  hint.textContent = PW_RULE;
  inp.addEventListener('input', function () {
    var v = inp.value;
    hint.classList.remove('ok', 'bad');
    if (!v) { hint.textContent = PW_RULE; return; }
    var bad = pwBad(v);
    hint.classList.add(bad ? 'bad' : 'ok');
    hint.textContent = bad ? PW_RULE : 'รหัสผ่านผ่านเกณฑ์แล้ว';
  });
}

// ------------------------------------------------------------------ utils
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
var MEM = {};
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k) != null ? localStorage.getItem(k) : (MEM[k] != null ? MEM[k] : null);
    if (v === null) { localStorage.removeItem(k); delete MEM[k]; } else { localStorage.setItem(k, v); MEM[k] = v; }
  } catch (e) { if (v === undefined) return MEM[k] != null ? MEM[k] : null; if (v === null) delete MEM[k]; else MEM[k] = v; }
  return null;
}
function isDark() {
  var t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function tcolor(code) { var t = IX.types[code]; var c = t ? t.color : '#8a8984'; return isDark() ? (DARK_STEP[c] || c) : c; }
function tlabel(code) { var t = IX.types[code]; return t ? t.label : code; }

function D(s) { return new Date(s + 'T00:00:00Z'); }
function iso(d) { return d.toISOString().slice(0, 10); }
function addDays(s, n) { var d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
function monthEnd(y, m) { return iso(new Date(Date.UTC(y, m, 0))); }
function ym(s) { return s.slice(0, 7); }
function wd(s) { return D(s).getUTCDay(); }
function thDate(s) { if (!s) return ''; var y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10); return d + ' ' + TH_M[m - 1] + ' ' + (y + 543); }
function thMonth(k, full) { var y = +k.slice(0, 4), m = +k.slice(5, 7); return full ? TH_MF[m - 1] + ' ' + (y + 543) : TH_M[m - 1] + ' ' + (y + 543); }
/**
 * ภาษาราชการในรายงาน PDF / อีเมล — เขียนคำเต็มแทนคำย่อบนหน้าจอ
 *   8 พ.ย. 2569 → 8 พฤศจิกายน 2569 · พ.ย. 2569 → พฤศจิกายน 2569 · ชม. → ชั่วโมง · (น.) → (นาที)
 *   เวลา "08:30 น." คงไว้ (น. = นาฬิกา ตามแบบหนังสือราชการ)
 */
var TH_M_RX = new RegExp('(^|[^\\u0E00-\\u0E7F.])(' + TH_M.map(function (x) { return x.replace(/\./g, '\\.'); }).join('|') + ') (\\d{4})', 'g');
function formalReport(html) {
  return String(html || '')
    .replace(TH_M_RX, function (all, pre, mm, y) { return pre + TH_MF[TH_M.indexOf(mm)] + ' ' + y; })
    .replace(/(\d+(?:\.\d+)?) ชม\. (\d+) น\./g, '$1 ชั่วโมง $2 นาที')
    .replace(/ชม\./g, 'ชั่วโมง')
    .replace(/\(น\.\)/g, '(นาที)')
    .replace(/\/น\.\)/g, '/นาที)');
}
function hrs(min, dash) {
  if (!min) return dash === false ? '0' : '–';
  var h = Math.round(min / 60 * 100) / 100;
  var t = h.toFixed(2).replace(/\.?0+$/, '');
  return t.replace(/^(\d+)/, function (x) { return x.replace(/\B(?=(\d{3})+(?!\d))/g, ','); });
}
function hm(min) { var h = Math.floor(min / 60), m = Math.round(min % 60); return h ? (m ? h + ' ชม. ' + m + ' น.' : h + ' ชม.') : m + ' นาที'; }
function hShort(min) { var h = Math.floor(min / 60), m = Math.round(min % 60); return m ? (h ? h + ':' + pad(m) : m + 'น') : h + 'ชม'; }
function pctTxt(p) { return p == null ? '–' : (Math.round(p * 1000) / 10).toFixed(1) + '%'; }

function toast(msg, err) {
  var t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(function () { t.className = 'toast'; }, err ? 5000 : 2600);
}

/** คำสั่งฝั่งเซิร์ฟเวอร์ที่อยู่ในไฟล์ที่เพิ่มภายหลัง — ใช้บอกผู้ดูแลว่าต้องสร้างไฟล์ไหน */
var API_FILE = { apiAttachList: '13_Attach', apiAttachUpload: '13_Attach', apiAttachDelete: '13_Attach',
                 apiAttendanceRange: '14_AttReport', apiGeoRef: '14_AttReport', apiRoomRoute: '16_Http' };
/**
 * เปิดจาก Apps Script (/exec) → google.script.run · เปิดจาก GitHub Pages หรือเว็บอื่น → fetch POST ไปที่ลิงก์ /exec
 * ลิงก์ /exec ของหน้าเว็บนอก Apps Script อยู่ใน config.js (window.PX_API_URL) — ดู 16_Http.gs
 */
function inAppsScript() { return !!(window.google && google.script && google.script.run); }
function callHttp(fn, args) {
  var url = String(window.PX_API_URL || '');
  if (!/^https:\/\//.test(url)) {
    var e0 = new Error('ยังไม่ได้ตั้งค่าลิงก์ระบบ (PX_API_URL ในไฟล์ config.js)'); e0.code = 'NO_API_URL';
    return Promise.reject(e0);
  }
  return fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                      body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) {
      if (!r.ok) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ (HTTP ' + r.status + ')');
      return r.text();
    })
    .then(function (t) {
      var x;
      try { x = JSON.parse(t); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — ตรวจว่า Deploy ให้ "ทุกคน" เข้าถึงได้ และวางไฟล์ 16_Http แล้ว'); }
      if (x && x.ok) return x.data;
      var er = new Error(x ? x.error : 'ไม่ได้รับคำตอบจากเซิร์ฟเวอร์'); er.code = x && x.code; throw er;
    }, function (e) {
      if (e && e.code) throw e;
      if (e instanceof TypeError) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่');
      throw e;
    });
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!inAppsScript()) return callHttp(fn, args);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(function (x) {
      if (x && x.ok) res(x.data); else { var er = new Error(x ? x.error : 'ไม่ได้รับคำตอบจากเซิร์ฟเวอร์'); er.code = x && x.code; rej(er); }
    }).withFailureHandler(function (e) { rej(e instanceof Error ? e : new Error(String(e))); });
    // ฟังก์ชันฝั่งเซิร์ฟเวอร์ยังไม่มีในเวอร์ชันที่ Deploy (เช่น ยังไม่ได้สร้างไฟล์สคริปต์ใหม่) — บอกชื่อไฟล์ที่ต้องเพิ่ม แทนข้อความ "reading 'apply'"
    if (typeof r[fn] !== 'function') {
      var file = API_FILE[fn];
      var er = new Error('ระบบยังไม่มีคำสั่ง ' + fn + ' ในเวอร์ชันที่ Deploy อยู่ — ' +
        (file ? 'สร้างไฟล์สคริปต์ ' + file + ' ใน Apps Script ' : 'วางโค้ดไฟล์สคริปต์ให้ครบ ') + 'แล้ว Deploy เวอร์ชันใหม่');
      er.code = 'NO_API';
      return rej(er);
    }
    r[fn].apply(r, args);
  });
}
function handleErr(e) {
  var msg = e && e.message || String(e);
  if (e && e.code === 'AUTH') { st.token = ''; store('px_tok', null); toast(msg, true); return showAuth(msg); }
  toast(msg, true);
}

// ------------------------------------------------------------------ fiscal calendar
function S(k) { return st.d.settings[k]; }
function HPD() { return Number(S('HOURS_PER_DAY')) || 8; }
function FYS() { return Number(S('FY_START_MONTH')) || 10; }
function fyOf(s) { var y = +s.slice(0, 4), m = +s.slice(5, 7); return FYS() === 1 ? y : (m >= FYS() ? y + 1 : y); }
function fyLabel(fy) { return 'ปีงบประมาณ ' + (fy + 543); }
function fyMonths(fy) {
  var out = [], y = FYS() === 1 ? fy : fy - 1, m = FYS();
  for (var i = 0; i < 12; i++) { out.push(y + '-' + pad(m)); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function qOf(s) { var m = +s.slice(5, 7); return Math.floor(((m - FYS() + 12) % 12) / 3) + 1; }
function rangeOfMonths(ms) { var a = ms[0], b = ms[ms.length - 1]; return { from: a + '-01', to: monthEnd(+b.slice(0, 4), +b.slice(5, 7)), months: ms }; }
function periodRange(p) {
  p = p || st.period;
  var k = p.key.split(':');
  if (p.mode === 'month') { var r = rangeOfMonths([k[1]]); r.label = thMonth(k[1], true); r.fy = fyOf(k[1] + '-01'); return r; }
  var fy = +k[1];
  if (p.mode === 'quarter') {
    var q = +k[2], ms = fyMonths(fy).slice((q - 1) * 3, q * 3), r2 = rangeOfMonths(ms);
    r2.label = 'ไตรมาส ' + q + ' ' + fyLabel(fy) + ' (' + thMonth(ms[0]) + ' – ' + thMonth(ms[2]) + ')'; r2.fy = fy; return r2;
  }
  var r3 = rangeOfMonths(fyMonths(fy)); r3.label = fyLabel(fy) + ' (' + thMonth(r3.months[0]) + ' – ' + thMonth(r3.months[11]) + ')'; r3.fy = fy; return r3;
}
function periodOptions(mode) {
  var months = IX.monthsAll, out = [];
  if (mode === 'month') return months.slice().reverse().map(function (m) { return { key: 'M:' + m, label: thMonth(m, true) }; });
  var fys = {};
  months.forEach(function (m) { fys[fyOf(m + '-01')] = 1; });
  var list = Object.keys(fys).map(Number).sort().reverse();
  if (mode === 'year') return list.map(function (f) { return { key: 'Y:' + f, label: fyLabel(f) }; });
  list.forEach(function (f) {
    for (var q = 4; q >= 1; q--) {
      var ms = fyMonths(f).slice((q - 1) * 3, q * 3);
      if (ms.some(function (m) { return months.indexOf(m) !== -1; })) out.push({ key: 'Q:' + f + ':' + q, label: 'ไตรมาส ' + q + ' · ' + fyLabel(f) + ' (' + thMonth(ms[0]) + '–' + thMonth(ms[2]) + ')' });
    }
  });
  return out;
}
function defaultKey(mode) {
  var t = st.d.today;
  if (mode === 'month') { var m = ym(t); return 'M:' + (IX.monthsAll.indexOf(m) !== -1 ? m : IX.monthsAll[IX.monthsAll.length - 1]); }
  var fy = fyOf(t);
  if (mode === 'quarter') return 'Q:' + fy + ':' + qOf(t);
  return 'Y:' + fy;
}

// ------------------------------------------------------------------ capacity & aggregation
var wdMemo = {};
function workdays(from, to) {
  var k = from + '|' + to; if (wdMemo[k] != null) return wdMemo[k];
  var n = 0, d = from;
  while (d <= to) { if (isWorkday(d)) n++; d = addDays(d, 1); }
  return (wdMemo[k] = n);
}
function pWindow(p) {
  var ps = S('PROJECT_START') || '1900-01-01';
  var s = p.startDate && p.startDate > ps ? p.startDate : ps;
  return { s: s, e: p.endDate || '9999-12-31' };
}
/** วันหยุดตามรอบเวร (OFF_SHIFT/OFF_NIGHT/OFF_EXT/OFF_HOLIDAY ฯลฯ) — อ่านจากธงในชีต Types ไม่ฮาร์ดโค้ดรหัส */
function isOffDuty(code) { var t = IX.types[code]; return !!t && t.offDuty === 'Y'; }

// ------------------------------------------------------------------ รอบวันทำการของโครงการ + ช่วงยกเว้น
// Settings.WORK_WEEK    = 'YYYY-MM-DD:1234;YYYY-MM-DD:2345' (0=อา … 6=ส) · ก่อนช่วงแรกใช้รอบของช่วงแรก · ว่าง = จ–ศ
// Settings.WORK_EXCLUDE = 'YYYY-MM-DD..YYYY-MM-DD|เหตุผล;…' — ไม่นับเลยเหมือนวันหยุด
// กติกาเดียวกับฝั่งเซิร์ฟเวอร์ (15_WorkCal.gs) — แก้ที่หนึ่งต้องแก้อีกที่ด้วย
var WC = { k: null, plan: [], ex: [] };
var WC_TH = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
var WC_ORDER = [1, 2, 3, 4, 5, 6, 0];        // ลำดับแสดงผล จ → อา
function wcParse() {
  var ww = String((st.d && st.d.settings && st.d.settings.WORK_WEEK) || ''), we = String((st.d && st.d.settings && st.d.settings.WORK_EXCLUDE) || '');
  var k = ww + '#' + we;
  if (WC.k === k) return WC;
  WC.k = k;
  WC.plan = ww.split(/[;\n]+/).map(function (x) { return x.trim(); }).filter(String).map(function (x) {
    var m = x.match(/^(\d{4}-\d{2}-\d{2})\s*:\s*([0-6]{1,7})$/);
    return m ? { from: m[1], days: m[2].split('').filter(function (c, i, a) { return a.indexOf(c) === i; }).sort().join('') } : null;
  }).filter(Boolean).sort(function (a, b) { return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
  WC.ex = we.split(/[;\n]+/).map(function (x) { return x.trim(); }).filter(String).map(function (x) {
    var m = x.match(/^(\d{4}-\d{2}-\d{2})\s*\.\.\s*(\d{4}-\d{2}-\d{2})\s*(?:\|\s*(.*))?$/);
    return m && m[2] >= m[1] ? { from: m[1], to: m[2], reason: String(m[3] || '').trim() } : null;
  }).filter(Boolean).sort(function (a, b) { return a.from < b.from ? -1 : 1; });
  wdMemo = {};
  return WC;
}
function wcDaysOf(d) {
  var p = wcParse().plan;
  if (!p.length) return '12345';
  var days = p[0].days;
  for (var i = 0; i < p.length; i++) if (p[i].from <= d) days = p[i].days;
  return days;
}
function wcDaysLabel(days) {
  var on = WC_ORDER.filter(function (n) { return String(days).indexOf(String(n)) !== -1; });
  if (!on.length) return 'ไม่มีวันทำการ';
  // ต่อเนื่องกัน → แสดงเป็นช่วง เช่น อ–ศ
  var idx = on.map(function (n) { return WC_ORDER.indexOf(n); });
  var run = idx.every(function (v, i) { return !i || v === idx[i - 1] + 1; });
  return run && on.length > 2 ? WC_TH[on[0]] + '–' + WC_TH[on[on.length - 1]] : on.map(function (n) { return WC_TH[n]; }).join(' ');
}
function isRhythmDay(d) { return wcDaysOf(d).indexOf(String(wd(d))) !== -1; }
function wcExcluded(d) {
  var ex = wcParse().ex;
  for (var i = 0; i < ex.length; i++) if (d >= ex[i].from && d <= ex[i].to) return ex[i];
  return null;
}
/** วันทำการโครงการ = อยู่ในรอบวันทำการ · ไม่ใช่วันหยุดราชการ · ไม่อยู่ในช่วงยกเว้น */
function isWorkday(d) { return isRhythmDay(d) && !(IX.hol && IX.hol[d]) && !wcExcluded(d); }
/** วันธรรมดาที่ไม่ใช่วันทำการเพราะรอบ/ช่วงยกเว้น (ไม่รวมวันหยุดราชการ) — ใช้ติดป้ายในปฏิทิน */
function wcOffInfo(d) {
  if (IX.hol && IX.hol[d]) return null;
  var e = wcExcluded(d);
  if (e) return { name: 'ช่วงยกเว้น' + (e.reason ? ': ' + e.reason : ''), kind: 'ex' };
  if (!isRhythmDay(d)) return { name: 'นอกรอบวันทำการ (' + wcDaysLabel(wcDaysOf(d)) + ')', kind: 'off' };
  return null;
}
/**
 * วันที่จะบันทึกการลาจากช่วงที่เลือก — ข้ามวันนอกรอบ/ช่วงยกเว้น/วันหยุดให้อัตโนมัติ
 * ถ้าไม่เหลือวันทำการเลย แต่เลือกวันธรรมดาที่อยู่นอกรอบ → บันทึกได้ แต่ไม่หักชั่วโมง (offOnly)
 */
function wcLeaveDates(from, to, max) {
  var all = [];
  for (var d = from; d <= to && all.length < (max || 400); d = addDays(d, 1)) all.push(d);
  var work = all.filter(isWorkday);
  if (work.length) return { dates: work, offOnly: false };
  var off = all.filter(function (x) { var w = wd(x); return !(IX.hol && IX.hol[x]) && ((w >= 1 && w <= 5) || isRhythmDay(x)); });

}
/** จำนวนวันทำการ (เป็นเศษส่วนได้) ที่ถูกกันไว้ด้วยวันหยุดตามรอบเวร ของคนคนนี้ในช่วง [s, e] —
 * เต็มวัน = 1 วัน, ครึ่งวัน/ระบุเวลา = นับตามสัดส่วนชั่วโมงจริงต่อวัน (รวมต่อวันแล้วไม่เกิน 1 วัน/วัน) */
function offDutyDays_(p, s, e) {
  var byDate = {};

    if (r.status === 'DELETED') return;

}

function aggregate(people, from, to) {
  // % เวลาโครงการคิดถึง "วันนี้" เท่านั้น — เดือนที่ยังไม่ถึงไม่ทำให้ % สูงเกินจริง
  // ชั่วโมงของรายการล่วงหน้ายังรวมในยอดชั่วโมงตามปกติ
  var pEnd = to < st.d.today ? to : st.d.today;
  var res = { by: {}, byType: {}, ded: 0, dedPct: 0, cap: 0, people: [], pEnd: pEnd, partial: pEnd < to };
  people.forEach(function (p) {
    var o = { p: p, byType: {}, ded: 0, dedPct: 0, cap: from <= pEnd ? capMin(p, from, pEnd) : 0, total: 0, n: 0 };
    (IX.recByP[p.personId] || []).forEach(function (r) {

// ------------------------------------------------------------------ คำขอที่ยังไม่มีรายการในตาราง
// คำขอในสมุดบันทึก ที่วันทำการของคำขอนั้นยังไม่มีรายการของคนนั้นเลย → แสดงเตือนให้สร้างรายการ
function computeGaps() {
  var out = [];
  st.d.requests.forEach(function (q) {
    if (!q.personId) return;
    var have = {};
    (IX.recByP[q.personId] || []).forEach(function (r) { have[r.date] = 1; });
    var miss = String(q.dates || '').split(',').filter(function (dt) {
      return dt && isWorkday(dt) && !have[dt];
    }).sort();
    // แยกเป็นช่วงวันทำการที่ต่อเนื่องกัน
    var run = [];
    function flush() { if (run.length) out.push({ q: q, personId: q.personId, from: run[0], to: run[run.length - 1], n: run.length }); run = []; }
    miss.forEach(function (dt) {
      if (run.length) { var nx = addDays(run[run.length - 1], 1); var guard = 0; while (!isWorkday(nx) && guard++ < 60) nx = addDays(nx, 1); if (nx !== dt) flush(); }
      run.push(dt);
    });
    flush();
  });
  return out.sort(function (a, b) { return a.from < b.from ? 1 : -1; });
}

function buildIndex() {
  var d = st.d; wdMemo = {};
  IX.types = {}; d.types.forEach(function (t) { IX.types[t.code] = t; });
  IX.typeOrder = d.types.slice().sort(function (a, b) { return (+a.order || 99) - (+b.order || 99); }).map(function (t) { return t.code; });
  // roster = รายชื่อย่อของทุกคน (ฝั่งผู้ปฏิบัติงานโครงการ) · people = ข้อมูลเต็มเท่าที่มีสิทธิ์เห็น
  IX.people = {}; (d.roster || []).forEach(function (p) { IX.people[p.personId] = p; });
  d.people.forEach(function (p) { IX.people[p.personId] = p; });
  IX.roster = (d.roster && d.roster.length ? d.roster : d.people).slice()
    .filter(function (p) { return p.status !== 'LEFT'; })
    .sort(function (a, b) { return a.fullName.localeCompare(b.fullName, 'th'); });
  IX.hol = {}; d.holidays.forEach(function (h) { IX.hol[h.date] = h; });
  IX.recByP = {}; IX.rec = {};
  d.records.forEach(function (r) { IX.rec[r.recordId] = r; (IX.recByP[r.personId] = IX.recByP[r.personId] || []).push(r); });
  for (var k in IX.recByP) IX.recByP[k].sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  IX.reqByPD = {};
  d.requests.forEach(function (q) {
    String(q.dates || '').split(',').filter(String).forEach(function (dt) {
      var key = q.personId + '|' + dt; (IX.reqByPD[key] = IX.reqByPD[key] || []).push(q);
    });
  });
  var ms = {};
  d.records.forEach(function (r) { ms[ym(r.date)] = 1; });
  ms[ym(d.today)] = 1;
  var keys = Object.keys(ms).sort();
  // เติมเดือนที่ขาดตรงกลาง
  var all = [], y = +keys[0].slice(0, 4), m = +keys[0].slice(5, 7), last = keys[keys.length - 1];
  while ((y + '-' + pad(m)) <= last) { all.push(y + '-' + pad(m)); m++; if (m > 12) { m = 1; y++; } }
  IX.monthsAll = all;
  IX.divisions = Object.keys(d.people.reduce(function (a, p) { if (p.role === 'KEY_USER' && p.division) a[p.division] = 1; return a; }, {})).sort();
  // ดัชนีวันหยุดตามรอบเวรที่ยังรอรับรอง (personId|date) — สร้างครั้งเดียวต่อการโหลด ไม่ไล่สแกน leaveReqs ทั้งหมดทุกครั้งที่เรียก pendingOffDuty_
  IX.offWaitPD = {};
  (d.leaveReqs || []).forEach(function (q) {
    if (q.status !== 'PENDING' || !isOffDuty(q.type)) return;
    var dates = q.dateList ? String(q.dateList).split(',').filter(String) : null;
    if (!dates) { dates = []; for (var dt = q.dateFrom; dt <= q.dateTo; dt = addDays(dt, 1)) dates.push(dt); }
    dates.forEach(function (dt) { IX.offWaitPD[q.personId + '|' + dt] = 1; });
  });
  IX.gaps = computeGaps();
  updateBadges();        // #leaveBadge รวมจำนวนรายการที่ต้องตรวจสอบไว้แล้ว
}

// ---------------------------------------------------------------- กลุ่มงานการพยาบาล (IPD / OPD / อื่น ๆ)
var GRP_L = { OPD: 'ผู้ป่วยนอก (OPD)', IPD: 'ผู้ป่วยใน (IPD)', ER: 'ฉุกเฉิน (ER)', OR: 'ห้องผ่าตัด (OR)',
              OTHER: 'อื่น ๆ', UNSET: 'ยังไม่ระบุประเภท' };
var GRP_C = { OPD: '#1baf7a', IPD: '#2a78d6', ER: '#e05252', OR: '#7c4dcc', OTHER: '#8a8984', UNSET: '#b9b7b1' };
var GRP_ORDER = ['OPD', 'IPD', 'ER', 'OR', 'OTHER', 'UNSET'];
/** ประเภทที่เลือกได้จริง (ไม่รวม UNSET ซึ่งแปลว่า "ยังไม่ได้เลือก") */
var GRP_PICK = ['OPD', 'IPD', 'ER', 'OR', 'OTHER'];

// ---------------------------------------------------------------- ประเภทบุคลากร (ระบุรายคนเท่านั้น)
var KIND_OPTS = [['', 'ยังไม่ระบุประเภท']].concat(GRP_PICK.map(function (g) { return [g, GRP_L[g]]; }));

/**
 * ประเภทของคนหนึ่งคน — อ่านจากค่ารายคนอย่างเดียว ไม่สืบทอดจากหน่วยงาน/งานการพยาบาล
 * เพราะงานการพยาบาลเดียวมีคน OPD/IPD/ER/OR ปนกันได้ · ยังไม่ระบุ = UNSET ให้ฝ่ายเลขานุการโครงการไล่เติม
 */
function unitKindOf(p) {
  var k = String((p || {}).unitKind || '').toUpperCase();
  return GRP_PICK.indexOf(k) !== -1 ? k : 'UNSET';
}
/** true = ยังไม่มีใครระบุประเภทให้คนนี้ */
function kindUnset(p) { return unitKindOf(p) === 'UNSET'; }
/** จำนวนคนที่ยังไม่ระบุประเภท (ใช้เตือนฝ่ายเลขานุการโครงการ) */

}
/** สรุปจำนวนคนแยกประเภทในรายชื่อที่ให้มา */
function kindCounts(list) {
  var o = {};
  (list || []).forEach(function (p) { var k = unitKindOf(p); o[k] = (o[k] || 0) + 1; });
  return o;
}
function allDivisions() {

  list.forEach(function (p) {
    var x = attStats(p, from, to, daily);
    o.work += x.work; o.present += x.present; o.absent += x.absent; o.leave += x.leave; o.noOut += x.noOut;
    o.workMin += x.workMin; o.meetMin += x.meetMin; o.otMin += x.otMin;
    if (p.ward) o.wards[p.ward] = 1;
  });
  // จำนวน "ครั้ง" ที่มีคนในกลุ่มนี้เข้าประชุม + จำนวนวงประชุมที่นับได้จริง
  var ids = {}; list.forEach(function (p) { ids[p.personId] = 1; });
  var seen = {};
  (st.d.eventAtt || []).forEach(function (r) {
    var m = IX.meetById[r.meetingId];
    if (!m || !meetCounts(m)) return;
    var d = m.date || String(r.inAt || '').slice(0, 10);
    if (!ids[r.personId] || d < from || d > to) return;
    o.meet++;
    if (!seen[r.meetingId]) { seen[r.meetingId] = 1; o.meetRounds++; }
  });
  o.rate = o.work ? o.present / o.work : null;
  o.nWard = Object.keys(o.wards).length;
  return o;
}
/** ประชุมภายในนับได้เมื่อรับรองแล้ว · ประชุมที่ฝ่ายเลขานุการโครงการสร้างนับได้ทันทีเหมือนเดิม */
function meetCounts(m) { return String(m.scope || '') !== 'INTERNAL' || m.status === 'CERTIFIED'; }

  $('#kpis').innerHTML = k.map(function (x) {

  }).join('');

  if (staff) renderQueue(); else $('#dashQueue').innerHTML = '';
  renderMix(people, r, W);

  // ---- กล่องดำ: % เวลาโครงการของทีม (ไม่แสดงรายชื่อ) ----

/** สมาชิกที่อยู่ในโครงการช่วงใดช่วงหนึ่งของ from–to */
function activeIn(p, from, to) { var w = pWindow(p); return w.s <= to && w.e >= from; }

/** ช่วงก่อนหน้าแบบเดียวกัน · ถ้าช่วงปัจจุบันยังไม่จบ เทียบจำนวนวันเท่ากัน */
function prevPeriod(r) {
  var p = st.period, k = p.key.split(':'), key;
  if (p.mode === 'month') { var y = +k[1].slice(0, 4), m = +k[1].slice(5, 7) - 1; if (!m) { m = 12; y--; } key = 'M:' + y + '-' + pad(m); }
  else if (p.mode === 'quarter') { var fy = +k[1], q = +k[2] - 1; if (!q) { q = 4; fy--; } key = 'Q:' + fy + ':' + q; }
  else key = 'Y:' + (+k[1] - 1);
  var pr = periodRange({ mode: p.mode, key: key });
  if (pr.to < (S('PROJECT_START') || '')) return null;
  var lab = p.mode === 'month' ? thMonth(pr.months[0]) : p.mode === 'quarter' ? 'ไตรมาสก่อน' : 'ปีงบประมาณก่อน';
  if (r.to > st.d.today && r.from <= st.d.today) {
    var to = addDays(pr.from, daysBetween(r.from, st.d.today));
    if (to < pr.to) { pr.to = to; lab += ' (ช่วงเดียวกัน ' + (daysBetween(r.from, st.d.today) + 1) + ' วันแรก)'; }
  }
  pr.label = lab;
  return pr;
}
function deltaTxt(cur, prev, kind) {
  var d = kind === 'pct' ? (prev ? (cur - prev) / prev * 100 : null) : cur - prev;
  if (d == null) return '';
  var v = Math.round(d * 10) / 10;
  if (Math.abs(v) < 0.05) return '● ไม่เปลี่ยนแปลง';
  return (v > 0 ? '▲ +' : '▼ ') + (kind === 'n' ? Math.round(v) : v.toFixed(1)) + (kind === 'pct' ? '%' : kind === 'pp' ? ' จุด' : '');
}
function delta(cur, prev, kind) {
  var t = deltaTxt(cur, prev, kind); if (!t) return '';
  var cls = /^▲/.test(t) ? 'up' : /^▼/.test(t) ? 'down' : 'flat';
  return '<div class="kpi-delta ' + cls + '">' + t + '</div>';
}

// ---- G: ข้อมูลโครงการ ----
function renderProject(people) {
  var t = st.d.today, s0 = S('PROJECT_START'), e0 = S('PROJECT_END'), phase = S('PROJECT_PHASE'), goal = S('PROJECT_GOAL');
  var tot = +S('UNITS_TOTAL') || 0;
  var now = people.filter(function (p) { return activeIn(p, t, t); });
  var wards = {}; now.forEach(function (p) { if (p.ward) wards[p.ward] = 1; });
  var nW = Object.keys(wards).length;
  var passed = s0 ? Math.max(0, daysBetween(s0, t)) : 0;
  var span = s0 && e0 ? Math.max(1, daysBetween(s0, e0)) : 0;
  var prog = span ? Math.min(100, Math.max(0, Math.round(passed / span * 100))) : null;
  var left = span ? daysBetween(t, e0) : null;
  $('#dashProject').innerHTML = '<div class="proj card mt">' +
    '<div class="proj-main">' +
      '<div class="proj-top"><span class="eyebrow">ข้อมูลโครงการ</span>' + (phase ? '<span class="st good">' + esc(phase) + '</span>' : '') + '</div>' +
      (goal ? '<p class="proj-goal">' + esc(goal) + '</p>' : (isStaff() ? '<p class="muted small">ยังไม่ได้ระบุเป้าหมายโครงการ · ตั้งได้ที่หน้า ตั้งค่า › ข้อมูลโครงการ</p>' : '')) +
      '<div class="proj-time">' +
        '<div class="proj-dates"><span>เริ่ม <b>' + (s0 ? thDate(s0) : '–') + '</b></span>' +
          (e0 ? '<span>สิ้นสุด <b>' + thDate(e0) + '</b></span>' : '') + '</div>' +
        (prog != null ? '<div class="proj-bar"><span style="width:' + prog + '%"></span></div>' +
          '<div class="proj-note">ผ่านไป <b class="num">' + passed + '</b> วัน (' + prog + '%) · ' + (left >= 0 ? 'เหลือ <b class="num">' + left + '</b> วัน' : 'สิ้นสุดแล้ว') + '</div>'
          : '<div class="proj-note">ดำเนินการมาแล้ว <b class="num">' + passed + '</b> วัน</div>') +
      '</div>' +
    '</div>' +
    '<div class="proj-side">' +
      '<div class="proj-stat"><span>หน่วยงานที่ครอบคลุม</span><b class="num">' + nW + (tot ? '<small> / ' + tot + '</small>' : '') + '</b>' +
        (tot ? '<div class="proj-bar sm"><span style="width:' + Math.min(100, Math.round(nW / tot * 100)) + '%"></span></div><em>' + Math.round(nW / tot * 100) + '% ของเป้าหมาย</em>' : '<em>หน่วยงานที่มีสมาชิกปฏิบัติงานอยู่</em>') + '</div>' +
      '<div class="proj-stat"><span>สมาชิกปัจจุบัน</span><b class="num">' + now.length + '<small> คน</small></b><em>' + allDivisions().length + ' งานการพยาบาล</em></div>' +
    '</div></div>';
}

// ---- F: งานค้างของฝ่ายเลขานุการโครงการ ----
function renderQueue() {
  var d = st.d, t = d.today, since = addDays(t, -30);
  var noOut = (d.attendance || []).filter(function (x) { return x.date < t && x.date >= since && x.inAt && !x.outAt; }).length;
  var intM = (d.meetings || []).filter(function (m) { return String(m.scope || '') === 'INTERNAL'; });
  var noDoc = intM.filter(function (m) { return (m.status === 'CERTIFIED' || m.status === 'PENDING') && m.date <= t && !m.docs; }).length;
  var rv = d.records.filter(function (r) { return r.flag === 'REVIEW' || r.type === 'UNSPEC'; }).length + (IX.gaps || []).length;
  var items = [
    ['ใบลารอรับรอง', (d.leaveReqs || []).filter(function (q) { return q.status === 'PENDING'; }).length, 'certify', 'warn'],
    ['ประชุมภายในรอรับรอง', intM.filter(function (m) { return m.status === 'PENDING'; }).length, 'meetadmin', 'warn'],
    ['รายการรอตรวจสอบ', rv, 'review', 'warn'],
    ['บัญชีรออนุมัติ', (d.accounts || []).filter(function (a) { return a.status === 'PENDING'; }).length, 'users', 'warn'],
    ['ไม่ได้ลงเวลากลับ (30 วัน)', noOut, 'clock', 'info'],
    ['ประชุมยังไม่มีเอกสารสรุป', noDoc, 'meetadmin', 'info']
  ];
  var total = items.reduce(function (s, x) { return s + x[1]; }, 0);
  $('#dashQueue').innerHTML = '<div class="card-head"><div><h2>งานที่รอฝ่ายเลขานุการโครงการ</h2><p class="sub">' +
    (total ? 'คลิกเพื่อไปหน้าที่ต้องจัดการ' : 'ไม่มีงานค้าง ✓') + '</p></div></div>' +
    '<div class="queue">' + items.map(function (x) {
      return '<button class="q-item' + (x[1] ? ' on ' + x[3] : '') + '" data-go="' + x[2] + '"><b class="num">' + x[1] + '</b><span>' + esc(x[0]) + '</span><i>›</i></button>';
    }).join('') + '</div>';
}

// ---- B: เวลาของทีมแยกตามประเภท ----
function renderMix(people, r, W) {
  var ids = {}; people.forEach(function (p) { ids[p.personId] = 1; });
  var end = r.to > st.d.today ? st.d.today : r.to;
  var byT = {};
  st.d.records.forEach(function (x) {
    if (!ids[x.personId] || x.date < r.from || x.date > end || x.status === 'DELETED' || isOffDuty(x.type)) return;
    byT[x.type] = (byT[x.type] || 0) + recMin(x);
  });
  var segs = [
    { k: 'in', label: 'ปฏิบัติงานในเวลาราชการ', min: Math.max(0, W.workMin - W.otMin), c: GRP_C.IPD },
    { k: 'ot', label: 'ปฏิบัติงานนอกเวลาราชการ', min: W.otMin, c: '#0f766e' }
  ].concat(IX.typeOrder.filter(function (c) { return byT[c]; }).map(function (c) {
    return { k: c, label: tlabel(c), min: byT[c], c: tcolor(c), rec: 1 };
  }));
  var tot = segs.reduce(function (s, x) { return s + x.min; }, 0);
  $('#mixSub').textContent = r.label + ' · รวม ' + hrs(tot, false) + ' ชม. ของทั้งทีม' + (W.meetMin ? ' · ในเวลาปฏิบัติงานมีประชุมภายใน ' + hrs(W.meetMin, false) + ' ชม.คน' : '');
  if (!tot) { $('#dashMix').innerHTML = '<div class="empty">ยังไม่มีข้อมูลเวลาในช่วงนี้</div>'; return; }
  var work = segs[0].min + segs[1].min;
  $('#dashMix').innerHTML =
    '<div class="mix-head"><div><b class="num">' + Math.round(work / tot * 100) + '%</b><span>เป็นเวลาปฏิบัติงาน</span></div>' +
      '<div><b class="num">' + Math.round((tot - work) / tot * 100) + '%</b><span>ลา / ภารกิจอื่น</span></div></div>' +
    '<div class="mix-bar">' + segs.filter(function (x) { return x.min; }).map(function (x) {
      var pc = x.min / tot * 100;
      return '<span style="width:' + pc + '%;background:' + x.c + '" title="' + esc(x.label) + ' · ' + hrs(x.min, false) + ' ชม. (' + pc.toFixed(1) + '%)"></span>';
    }).join('') + '</div>' +
    '<div class="mix-legend">' + segs.filter(function (x) { return x.min; }).map(function (x) {
      return '<div class="mix-li' + (x.rec ? ' rec' : '') + '"><span class="sw" style="background:' + x.c + '"></span><span class="nm">' + esc(x.label) + '</span>' +
        '<b class="num">' + hrs(x.min, false) + ' <small>ชม.</small></b><em class="num">' + (x.min / tot * 100).toFixed(1) + '%</em></div>';
    }).join('') + '</div>';
}

// ---- C: ปฏิทินการมาปฏิบัติงานรายวัน ----
function heatColor(rate) {
  if (rate == null) return '';
  var steps = ['#fde2e1', '#fdecc8', '#dbeafe', '#93c5fd', '#3b82f6', '#1d4ed8'];
  return steps[rate < .5 ? 0 : rate < .7 ? 1 : rate < .8 ? 2 : rate < .9 ? 3 : rate < .97 ? 4 : 5];
}
function renderHeat(daily, r) {
  var end = r.to > st.d.today ? st.d.today : r.to;
  var start = r.from;
  while (wd(start) !== 1) start = addDays(start, -1);              // เริ่มที่วันจันทร์
  var cols = [], col = null, lows = [];
  for (var d = start; d <= r.to; d = addDays(d, 1)) {
    var w = wd(d); if (w === 0 || w === 6) continue;
    if (w === 1 || !col) { col = []; cols.push(col); }
    var x = daily[d], inR = d >= r.from && d <= r.to;
    var cell = { d: d, inR: inR, fut: d > end, hol: !isWorkday(d), x: x };
    if (inR && !cell.fut && !cell.hol && x && x.work) { cell.rate = x.present / x.work; lows.push(cell); }
    col.push(cell);
  }
  var big = cols.length <= 6;
  var TH5 = ['จ', 'อ', 'พ', 'พฤ', 'ศ'];
  var html = '<div class="heat' + (big ? ' big' : '') + '"><div class="heat-rows">' + TH5.map(function (l) { return '<span>' + l + '</span>'; }).join('') + '</div>' +
    '<div class="heat-grid" style="grid-template-columns:repeat(' + cols.length + ',' + (big ? 'minmax(0,1fr)' : '14px') + ')">' +
    cols.map(function (c) {
      var pad5 = []; for (var i = 0; i < 5; i++) pad5.push(c.filter(function (x) { return wd(x.d) === i + 1; })[0] || null);
      return pad5.map(function (x) {
        if (!x || !x.inR) return '<i class="hc out"></i>';
        if (x.hol) return '<i class="hc hol" title="' + thDate(x.d) + ' · วันหยุด"></i>';
        if (x.fut) return '<i class="hc fut" title="' + thDate(x.d) + '"></i>';
        if (x.d === st.d.today) return '<i class="hc today" title="วันนี้ · ยังไม่จบวัน">' + (big ? '<b>' + +x.d.slice(8) + '</b><em>วันนี้</em>' : '') + '</i>';
        if (x.rate == null) return '<i class="hc none" title="' + thDate(x.d) + ' · ไม่มีข้อมูล"></i>';
        var tip = TH_WD_FULL[wd(x.d)] + ' ' + thDate(x.d) + ' · มา ' + x.x.present + '/' + x.x.work + ' คน (' + Math.round(x.rate * 100) + '%)' + (x.x.leave ? ' · ลา ' + x.x.leave : '');
        return '<i class="hc" style="background:' + heatColor(x.rate) + '" title="' + esc(tip) + '">' + (big ? '<b>' + +x.d.slice(8) + '</b><em>' + Math.round(x.rate * 100) + '%</em>' : '') + '</i>';
      }).join('');
    }).join('') + '</div></div>' +
    '<div class="heat-scale"><span>น้อย</span>' + [.4, .6, .75, .85, .93, 1].map(function (v) { return '<i style="background:' + heatColor(v) + '"></i>'; }).join('') + '<span>มาก</span>' +
      '<span class="heat-key"><i class="hc hol"></i>วันหยุด</span></div>';
  lows.sort(function (a, b) { return a.rate - b.rate; });
  if (lows.length) html += '<div class="heat-low"><b>วันที่คนน้อยที่สุด</b>' + lows.slice(0, 3).map(function (x) {
    return '<span>' + TH_WD[wd(x.d)] + ' ' + thDate(x.d) + ' · ' + Math.round(x.rate * 100) + '%</span>';
  }).join('') + '</div>';
  else html += '<div class="empty" style="padding:14px">ยังไม่มีข้อมูลการลงเวลาในช่วงนี้</div>';
  $('#dashHeat').innerHTML = html;
  $('#heatSub').textContent = 'สัดส่วนสมาชิกที่มาปฏิบัติงานในแต่ละวันทำการ · ' + r.label + ' · ชี้ที่ช่องเพื่อดูตัวเลข';
}

// ---- D: ตามวันในสัปดาห์ ----
function renderWeek(daily) {
  var agg = [1, 2, 3, 4, 5].map(function () { return { w: 0, p: 0, l: 0, n: 0 }; });
  Object.keys(daily).forEach(function (d) {
    var w = wd(d); if (w < 1 || w > 5) return;
    var x = daily[d]; if (!x.work) return;
    agg[w - 1].w += x.work; agg[w - 1].p += x.present; agg[w - 1].l += x.leave; agg[w - 1].n++;
  });
  var rates = agg.map(function (a) { return a.w ? a.p / a.w : null; });
  var valid = rates.filter(function (v) { return v != null; });
  if (!valid.length) { $('#dashWeek').innerHTML = '<div class="empty">ยังไม่มีข้อมูลการลงเวลาในช่วงนี้</div>'; return; }
  var mn = Math.min.apply(null, valid), mx = Math.max.apply(null, valid);
  $('#dashWeek').innerHTML = '<div class="wk">' + agg.map(function (a, i) {
    var v = rates[i];
    return '<div class="wk-row' + (v === mn && mn !== mx ? ' low' : '') + '"><span class="wk-d">' + TH_WD_FULL[i + 1] + '</span>' +
      '<div class="wk-bar"><span style="width:' + (v == null ? 0 : Math.round(v * 100)) + '%"></span></div>' +
      '<b class="num">' + (v == null ? '–' : Math.round(v * 100) + '%') + '</b>' +
      '<em class="num">' + (a.n ? 'ลาเฉลี่ย ' + (a.l / a.n).toFixed(1) + ' คน/วัน' : '') + '</em></div>';
  }).join('') + '</div>' +
    (mn !== mx ? '<p class="note small" style="margin-top:12px">วัน<b>' + TH_WD_FULL[rates.indexOf(mn) + 1] + '</b>มีผู้มาปฏิบัติงานน้อยที่สุด (' + Math.round(mn * 100) + '%) · วัน<b>' + TH_WD_FULL[rates.indexOf(mx) + 1] + '</b>มากที่สุด (' + Math.round(mx * 100) + '%) · ใช้ประกอบการวางแผนนัดประชุมหรืองานที่ต้องใช้บุคลากรจำนวนมาก</p>' : '');
}

  var cert = intM.filter(function (m) { return m.status === 'CERTIFIED'; });

      '<div><span>มีเอกสารสรุป <em class="muted">(จากวงที่รับรองแล้ว)</em></span><b class="num">' + withDoc + '/' + cert.length + '</b>' +

/** แสดง/ซ่อนข้อความ "ไม่มีข้อมูล" ทับกราฟ โดยไม่ลบ canvas (เปลี่ยนช่วงแล้วกราฟกลับมาได้) */
function chartEmpty(cv, msg) {
  var box = cv.parentNode, em = box.querySelector('.chart-empty');
  cv.style.display = msg ? 'none' : '';
  if (em) { em.textContent = msg || ''; em.classList.toggle('hide', !msg); }
}

/** วงกลม/แท่งแยกตามกลุ่มงานการพยาบาล + ตารางใต้กราฟ (คลิกวงกลมเพื่อเจาะลงไป) */
var LV_NAME = ['ประเภทบุคลากร', 'งานการพยาบาล', 'หน่วยงาน', 'รายชื่อบุคลากร'];
/** เจาะลงอีกชั้น (สูงสุด 4 ชั้น: ประเภท → งานการพยาบาล → หน่วยงาน → รายชื่อบุคลากร) */
function drillTo(key) { if (DASH.lv.length >= 3 || !key) return; DASH.lv = DASH.lv.concat([String(key)]); RENDER.dash(); }

/** คนที่ตรงกับตัวกรองชั้นปัจจุบัน (DASH.lv): [] = ทุกคน, [type] = +ประเภท, [type,div] = +งานการพยาบาล, [type,div,ward] = +หน่วยงาน */
function unitScopedPeople(people, lv) {
  return people.filter(function (p) {
    if (lv[0] && unitKindOf(p) !== lv[0]) return false;
    if (lv[1] && (p.division || '(ไม่ระบุ)') !== lv[1]) return false;
    if (lv[2] && (p.ward || '(ไม่ระบุ)') !== lv[2]) return false;
    return true;
  });
}
/** รายชื่อบุคลากรที่กรองด้วย DASH.lv ปัจจุบัน (เฉพาะคนที่ยังปฏิบัติงานในช่วง r) — ใช้ซ้ำโดยช่องค้นหาด้วย */
function unitScopeNow(r) {
  var act = filteredPeople().filter(function (p) { return activeIn(p, r.from, r.to); });
  return unitScopedPeople(act, DASH.lv);
}
function renderUnits(people, r) {
  var lv = DASH.lv;
  if (lv[0] === '__ALL__' || (lv.length && !GRP_L[lv[0]])) { lv = DASH.lv = []; }
  var lvl = lv.length, unset = 0;
  people.forEach(function (p) { if (unitKindOf(p) === 'UNSET') unset++; });
  var scope = unitScopedPeople(people, lv);
  var showAgg = lvl < 3;
  $('#unitPies').classList.toggle('hide', !showAgg);
  $('#unitLegend').classList.toggle('hide', !showAgg);
  $('#unitBack').classList.toggle('hide', !lvl);
  $('#unitViewAll').classList.toggle('hide', !lvl);

  if (!showAgg) {
    $('#unitTitle').textContent = 'หน่วยงาน ' + lv[2];
    $('#unitSub').innerHTML = esc(['ทุกประเภท', GRP_L[lv[0]], lv[1]].join(' › ') + ' · ' + r.label);
  } else {
    var keyOf = lvl === 0 ? function (p) { return unitKindOf(p); }
      : lvl === 1 ? function (p) { return p.division || '(ไม่ระบุ)'; }
      : function (p) { return p.ward || '(ไม่ระบุ)'; };
    var buckets = {}, order = [];
    scope.forEach(function (p) {
      var key = keyOf(p);
      if (!buckets[key]) { buckets[key] = []; order.push(key); }
      buckets[key].push(p);
    });
    if (lvl === 0) order = GRP_ORDER.filter(function (g) { return buckets[g]; });
    else order.sort(function (a, b) { return buckets[b].length - buckets[a].length || a.localeCompare(b, 'th'); });

    var rows = order.map(function (key, i) {
      var w = workStats(buckets[key], r.from, r.to);
      return { key: key, label: lvl === 0 ? GRP_L[key] : key,
               color: lvl === 0 ? GRP_C[key] : DIV_PALETTE[i % DIV_PALETTE.length], w: w };
    });

    $('#unitTitle').textContent = lvl === 0 ? 'บุคลากรในโครงการ Phoenix'
      : lvl === 1 ? 'งานการพยาบาลใน ' + GRP_L[lv[0]] : 'หน่วยงานใน ' + lv[1];
    var crumb = lvl ? ['ทุกประเภท'].concat(lvl === 1 ? [GRP_L[lv[0]]] : [GRP_L[lv[0]], lv[1]]).join(' › ') + ' · ' : '';
    $('#unitSub').innerHTML = esc(crumb + rows.length + ' ' + LV_NAME[lvl] + ' · คลิกที่วงกลมหรือแถวเพื่อกรองรายชื่อด้านล่าง · ' + r.label) +
      (unset ? '<br><span class="t-warn">ยังไม่ได้ระบุประเภทบุคลากร ' + unset + ' ราย — ระบุได้ที่ ผู้ใช้ › หน่วยงาน (เติมทั้งหน่วย) หรือที่หน้ารายบุคคลทีละคน</span>' : '');

    $('#unitLegend').innerHTML = rows.map(function (x) {
      return '<li><span class="sw" style="background:' + x.color + '"></span>' + esc(x.label) + ' <span class="muted">(' + x.w.n + ')</span></li>';
    }).join('');

    if (!rows.length) {
      $('#unitTable').innerHTML = '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>';
      chartEmpty($('#piePeople'), ''); chartEmpty($('#pieHours'), ''); chartEmpty($('#barRate'), '');
    } else {
      pie('piePeople', rows, function (x) { return x.w.n; }, ' คน', true);
      pie('pieHours', rows, function (x) { return Math.round(x.w.workMin / 60); }, ' ชม.', true);
      rateBar('barRate', rows, true);
      var tot = rows.reduce(function (t, x) {
        t.n += x.w.n; t.work += x.w.work; t.present += x.w.present; t.workMin += x.w.workMin; t.meet += x.w.meet; return t;
      }, { n: 0, work: 0, present: 0, workMin: 0, meet: 0 });
      $('#unitTable').innerHTML = '<table class="tbl"><thead><tr><th>' + LV_NAME[lvl] +
        '</th><th class="r">สมาชิก</th><th class="r">วันทำงาน</th><th class="r">มาปฏิบัติงาน</th><th>อัตราการเข้าร่วม</th><th class="r">เวลาปฏิบัติงาน (ชม.)</th><th class="r">ประชุม</th></tr></thead><tbody>' +
        rows.map(function (x) {
          return '<tr class="click" data-grp="' + esc(x.key) + '"><td><span class="sw" style="background:' + x.color + ';margin-right:6px;vertical-align:-1px"></span>' + esc(x.label) + '</td>' +
            '<td class="r num">' + x.w.n + '</td><td class="r num">' + x.w.work + '</td><td class="r num">' + x.w.present + '</td>' +
            '<td>' + meter(x.w.rate) + '</td><td class="r num">' + hrs(x.w.workMin, false) + '</td><td class="r num">' + (x.w.meet || '–') + '</td></tr>';
        }).join('') +
        '</tbody><tfoot><tr><td>รวม</td><td class="r num">' + tot.n + '</td><td class="r num">' + tot.work + '</td><td class="r num">' + tot.present + '</td>' +
        '<td>' + meter(tot.work ? tot.present / tot.work : null) + '</td><td class="r num">' + hrs(tot.workMin, false) + '</td><td class="r num">' + (tot.meet || '–') + '</td></tr></tfoot></table>';
    }
  }
  renderUnitPeopleList(scope, r);
}
/** รายชื่อบุคลากรของตัวกรองปัจจุบัน — แสดงเสมอไม่ว่าจะเจาะไปชั้นไหน (ไม่ต้องกดจนครบ 3 ชั้นถึงจะเห็นชื่อคน) */

  var list = scope.map(function (p) { return by[p.personId] || { p: p, byType: {}, ded: 0, dedPct: 0, cap: 0, total: 0, n: 0, pct: null }; });
  $('#unitPeopleCount').textContent = ' · ' + list.length + ' คน';
  $('#unitSearch').value = st.search;
  renderPeopleTable({ people: list }, r, 'unitPeople');
}
var DIV_PALETTE = ['#2a78d6', '#1baf7a', '#eb6834', '#6250d6', '#eda100', '#e87ba4', '#0f766e', '#b45309', '#0ea5e9', '#9085e9', '#65a30d', '#be123c', '#475569', '#008300'];
function chartFont() { return { family: 'Roboto, Noto Sans Thai', size: 12 }; }
function pie(id, rows, valFn, unit, clickable) {
  var cv = $('#' + id); if (!cv) return;
  if (charts[id]) { charts[id].destroy(); charts[id] = null; }

  charts[id] = new Chart(cv, {
    type: 'pie',

function rateBar(id, rows, clickable) {

}

function renderPeopleTable(a, r, into) {
  var box = $('#' + (into || 'peopleTable')); if (!box) return;
  r = r || periodRange();
  var q = st.search.trim().toLowerCase();
  var rows = a.people.filter(function (o) {
    return !q || (o.p.fullName + ' ' + o.p.ward + ' ' + o.p.division + ' ' + o.p.sap).toLowerCase().indexOf(q) !== -1;
  }).map(function (o) { return { o: o, p: o.p, w: attStats(o.p, r.from, r.to), g: unitKindOf(o.p) }; });
  (st.d.eventAtt || []).forEach(function (e) {
    var d = String(e.inAt || '').slice(0, 10);
    if (d < r.from || d > r.to) return;
    rows.forEach(function (x) { if (x.p.personId === e.personId) x.meet = (x.meet || 0) + 1; });
  });
  var sk = st.sort.key, dir = st.sort.dir;
  rows.sort(function (x, y) {
    if (sk === 'name') return dir * x.p.fullName.localeCompare(y.p.fullName, 'th');
    if (sk === 'unit') return dir * ((x.p.division || '').localeCompare(y.p.division || '', 'th') || x.p.fullName.localeCompare(y.p.fullName, 'th'));
    var vx, vy;
    if (sk === 'rate') { vx = x.w.rate == null ? 9 : x.w.rate; vy = y.w.rate == null ? 9 : y.w.rate; }
    else if (sk === 'work') { vx = -x.w.workMin; vy = -y.w.workMin; }
    else if (sk === 'meet') { vx = -(x.meet || 0); vy = -(y.meet || 0); }
    else { vx = x.o.pct == null ? 9 : x.o.pct; vy = y.o.pct == null ? 9 : y.o.pct; }
    return dir * (vx - vy);
  });
  function th(key, label, cls) { return '<th class="sort ' + (cls || '') + '" data-sort="' + key + '">' + label + (sk === key ? (dir > 0 ? ' ↓' : ' ↑') : '') + '</th>'; }
  var tot = rows.reduce(function (t, x) {
    t.work += x.w.work; t.present += x.w.present; t.workMin += x.w.workMin; t.meet += x.meet || 0;
    if (x.o.pct != null) { t.dp += x.o.dedPct; t.cap += x.o.cap; }
    return t;
  }, { work: 0, present: 0, workMin: 0, meet: 0, dp: 0, cap: 0 });
  box.innerHTML = rows.length ? '<table class="tbl"><thead><tr>' + th('name', 'ชื่อ-สกุล') + th('unit', 'งานการพยาบาล') + '<th>ทีม</th>' +
    th('work', 'เวลาปฏิบัติงาน (ชม.)', 'r') + '<th class="r">วันทำงาน</th><th class="r">มาปฏิบัติงาน</th>' + th('rate', 'อัตราการเข้าร่วม') + th('meet', 'ประชุม', 'r') +
    th('pct', '% เวลาโครงการ') + '<th></th></tr></thead><tbody>' +
    rows.map(function (x) {
      return '<tr class="click" data-person="' + x.p.personId + '"><td><div class="nm">' + esc(x.p.fullName) + '</div><div class="muted small">' + esc(x.p.ward) + '</div></td>' +
        '<td class="small"><span class="sw" style="background:' + GRP_C[x.g] + ';margin-right:5px;vertical-align:-1px"></span>' + esc(x.p.division || '–') + '</td>' +
        '<td>' + TEAM_L[x.p.team] + '</td>' +
        '<td class="r num">' + hrs(x.w.workMin, false) + '</td>' +
        '<td class="r num">' + (x.w.work || '–') + '</td><td class="r num">' + (x.w.present || '–') + '</td>' +
        '<td>' + meter(x.w.rate) + '</td><td class="r num">' + (x.meet || '–') + '</td>' +
        '<td>' + meter(x.o.pct) + '</td><td>' + stPill(x.o.pct) + '</td></tr>';
    }).join('') + '</tbody><tfoot><tr><td>รวม ' + rows.length + ' คน</td><td></td><td></td>' +
    '<td class="r num">' + hrs(tot.workMin, false) + '</td><td class="r num">' + tot.work + '</td><td class="r num">' + tot.present + '</td>' +
    '<td>' + meter(tot.work ? tot.present / tot.work : null) + '</td><td class="r num">' + (tot.meet || '–') + '</td>' +
    '<td>' + meter(tot.cap ? 1 - tot.dp / tot.cap : null) + '</td><td></td></tr></tfoot></table>'
    : '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>';
}

          }).join('') + '</div></td>' +

      }).join('') + '</tbody></table></div>'

  html += '<h3 class="wc-h">ช่วงยกเว้น (ไม่นับเลยเหมือนวันหยุด)</h3>' +

$('#wcBox').addEventListener('change', function (ev) {
  var el = ev.target, e = wcEditInit();
  if (el.hasAttribute('data-wcp')) {
    var x = e.plan[+el.getAttribute('data-wcp')]; if (!x) return;
    if (el.hasAttribute('data-day')) {
      var n = el.getAttribute('data-day'), set = x.days.split('').filter(function (c) { return c !== n; });
      if (el.checked) set.push(n);
      x.days = set.sort().join('');
    } else x.from = el.value;
    renderWorkCal();
  } else if (el.hasAttribute('data-wce')) {
    var y = e.ex[+el.getAttribute('data-wce')]; if (!y) return;
    y[el.getAttribute('data-k')] = el.value.trim();
    if (el.getAttribute('data-k') !== 'reason') renderWorkCal();
  }
});
$('#wcBox').addEventListener('click', function (ev) {
  var e = wcEditInit(), b;
  if ((b = ev.target.closest('[data-wcp-add]'))) {
    var last = e.plan[e.plan.length - 1];
    e.plan.push(last ? { from: st.d.today, days: last.days } : { from: S('PROJECT_START') || st.d.today, days: '12345' });
    return renderWorkCal();
  }
  if ((b = ev.target.closest('[data-wcp-del]'))) { e.plan.splice(+b.getAttribute('data-wcp-del'), 1); return renderWorkCal(); }
  if ((b = ev.target.closest('[data-wce-add]'))) { e.ex.push({ from: st.d.today, to: st.d.today, reason: '' }); return renderWorkCal(); }
  if ((b = ev.target.closest('[data-wce-del]'))) { e.ex.splice(+b.getAttribute('data-wce-del'), 1); return renderWorkCal(); }
});
$('#wcSave').addEventListener('click', function () {
  var e = wcEditInit(), btn = this, seen = {};
  for (var i = 0; i < e.plan.length; i++) {
    var x = e.plan[i];
    if (!isDate(x.from)) return toast('กรุณาระบุวันที่เริ่มของรอบวันทำการให้ครบ', true);
    if (!x.days) return toast('รอบที่เริ่ม ' + thDate(x.from) + ' ยังไม่ได้เลือกวันทำการ', true);
    if (seen[x.from]) return toast('มีรอบวันทำการที่เริ่มวันที่ ' + thDate(x.from) + ' ซ้ำกัน', true);
    seen[x.from] = 1;
  }
  for (var j = 0; j < e.ex.length; j++) {
    var y = e.ex[j];
    if (!isDate(y.from) || !isDate(y.to)) return toast('กรุณาระบุวันที่ของช่วงยกเว้นให้ครบ', true);
    if (y.to < y.from) return toast('ช่วงยกเว้น: วันสิ้นสุดต้องไม่ก่อนวันเริ่ม', true);
  }
  var vw = e.plan.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; }).map(function (x) { return x.from + ':' + x.days; }).join(';');
  var ve = e.ex.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; })
    .map(function (y) { return y.from + '..' + y.to + (y.reason ? '|' + y.reason.replace(/[;|\n]/g, ' ') : ''); }).join(';');

  if (!jobs.length) return toast('ไม่มีการเปลี่ยนแปลง');
  btn.disabled = true;
  jobs.reduce(function (pr, jb) {
    return pr.then(function () { return call('apiSaveSetting', st.token, jb.k, jb.v).then(function (o) { st.d.settings[jb.k] = o.value; }); });
  }, Promise.resolve()).then(function () {
    wdMemo = {}; WCE = null;
    toast('บันทึกรอบวันทำการแล้ว — ตัวเลขทุกหน้าคำนวณใหม่ตามรอบนี้');
    rerender();
  }).catch(handleErr).then(function () { btn.disabled = false; });
});

var ATTACH_MIME_BY_EXT = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp',
  doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
var ATTACH_ACCEPT = '.pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx';
function fileSizeTxt(n) { n = Number(n) || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.ceil(n / 1024)) + ' KB'; }
/** การ์ดแนบไฟล์แบบใช้ซ้ำได้ — เรียก wireAttachBox(boxId, ctx, refId) อีกครั้งหลังแปะ HTML นี้ลงหน้าแล้วเสมอ */
function attachBoxHtml(boxId) {
  return '<div class="attach-box" id="' + boxId + '"><div class="attach-list"></div>' +
    '<label class="btn sm attach-add">+ แนบไฟล์<input type="file" accept="' + ATTACH_ACCEPT + '" hidden></label>' +
    '<span class="muted small">PDF / รูปภาพ / Word / Excel · ไม่เกิน 10MB ต่อไฟล์</span></div>';
}
function attachRenderList_(boxId, list) {
  var el = document.querySelector('#' + boxId + ' .attach-list');
  if (!el) return;
  el.innerHTML = list.length ? list.map(function (a) {
    return '<div class="attach-item"><a href="' + esc(a.fileUrl) + '" target="_blank" rel="noopener">📎 ' + esc(a.fileName) + '</a>' +
      '<span class="muted small">' + fileSizeTxt(a.size) + ' · ' + esc(a.uploadedBy) + '</span>' +
      '<button class="btn sm icon" data-attach-del="' + a.attachId + '" title="ลบไฟล์แนบ">✕</button></div>';
  }).join('') : '<div class="muted small">ยังไม่มีไฟล์แนบ</div>';
}
function attachLoad_(boxId, ctx, refId) {
  call('apiAttachList', st.token, ctx, refId).then(function (list) { attachRenderList_(boxId, list); })
    .catch(function (e) {
      // ยังไม่ได้เปิดใช้การแนบไฟล์ (ไม่มีไฟล์ 13_Attach หรือยังไม่ตั้งโฟลเดอร์) — แสดงในกล่อง ไม่ขึ้นข้อความเตือนรบกวนการแก้ไขรายการ
      var el = document.querySelector('#' + boxId + ' .attach-list');
      if (e && (e.code === 'NO_API' || e.code === 'ATTACH_OFF')) {
        if (el) el.innerHTML = '<div class="muted small">' + esc(e.code === 'NO_API' ? 'ยังไม่ได้เปิดใช้การแนบไฟล์ในระบบ' : e.message) + '</div>';
        var add = document.querySelector('#' + boxId + ' .attach-add'); if (add) add.classList.add('hide');
        return;
      }
      attachRenderList_(boxId, []); toast(e && e.message || 'โหลดไฟล์แนบไม่สำเร็จ', true);
    });
}
/** ผูกการ์ดแนบไฟล์กับ context+refId จริง — เรียกทุกครั้งที่เปิด/เปลี่ยนรายการ (โหลดรายชื่อไฟล์ใหม่เสมอ) */
function wireAttachBox(boxId, ctx, refId) {
  var box = document.querySelector('#' + boxId);
  if (!box) return;
  box.setAttribute('data-ctx', ctx); box.setAttribute('data-ref', refId);
  attachLoad_(boxId, ctx, refId);
  if (box._wired) return;
  box._wired = true;
  box.querySelector('input[type=file]').addEventListener('change', function (e) {
    var f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) return toast('ไฟล์ใหญ่เกิน 10MB', true);
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    var mime = f.type || ATTACH_MIME_BY_EXT[ext] || '';
    if (!ATTACH_MIME_BY_EXT[ext]) return toast('รองรับเฉพาะไฟล์ PDF / รูปภาพ / Word / Excel', true);
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1] || '';
      call('apiAttachUpload', st.token, box.getAttribute('data-ctx') || ctx, box.getAttribute('data-ref') || refId, f.name, mime, b64)
        .then(function () { attachLoad_(boxId, box.getAttribute('data-ctx') || ctx, box.getAttribute('data-ref') || refId); toast('แนบไฟล์เรียบร้อยแล้ว'); })
        .catch(handleErr);
    };
    reader.readAsDataURL(f);
  });
  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-attach-del]'); if (!b) return;
    if (!confirm('ลบไฟล์แนบนี้?')) return;
    call('apiAttachDelete', st.token, b.getAttribute('data-attach-del'))
      .then(function () { attachLoad_(boxId, box.getAttribute('data-ctx') || ctx, box.getAttribute('data-ref') || refId); })
      .catch(handleErr);
  });
}

RENDER.cal = function () {

  $('#calDiv').innerHTML = '<option value="">ทั้งหมด</option>' + IX.divisions.map(function (v) { return '<option' + (st.calDiv === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  $('#calLegend').innerHTML = IX.typeOrder.map(function (c) { return '<li><span class="sw" style="background:' + tcolor(c) + '"></span>' + esc(tlabel(c)) + '</li>'; }).join('') +
    '<li><span class="sw" style="background:repeating-linear-gradient(135deg,var(--outline) 0 3px,transparent 3px 6px);border:1px solid var(--outline)"></span>วันหยุดราชการ / นอกรอบวันทำการ / ช่วงยกเว้น</li>';
  var Y = +st.calMonth.slice(0, 4), M = +st.calMonth.slice(5, 7), days = [];
  for (var d = st.calMonth + '-01', end = monthEnd(Y, M); d <= end; d = addDays(d, 1)) { var w = wd(d); if (w !== 0 && w !== 6) days.push(d); }
  var from = st.calMonth + '-01', to = monthEnd(Y, M);
  var ppl = filteredPeople({ team: st.calTeam, div: st.calDiv }).filter(function (p) { var w2 = pWindow(p); return w2.s <= to && w2.e >= from; });
  var head = '<thead><tr><th class="pn">ชื่อ-สกุล</th>' + days.map(function (dd) {
    var oi = IX.hol[dd] || wcOffInfo(dd);
    return '<th' + (oi ? ' class="off"' : '') + ' title="' + esc(oi ? oi.name : '') + '">' + (+dd.slice(8)) + '<span class="wd">' + TH_WD[wd(dd)] + '</span></th>';
  }).join('') + '</tr></thead>';
  var body = '';

    var list = ppl.filter(function (p) { return p.team === team; });

    body += '<tr class="team-row"><th class="pn">TEAM ' + TEAM_L[team].toUpperCase() + ' · ' + list.length + ' คน</th>' + days.map(function () { return '<th></th>'; }).join('') + '</tr>';
    list.forEach(function (p) {
      var byD = {};
      (IX.recByP[p.personId] || []).forEach(function (r) { if (r.date >= from && r.date <= to) (byD[r.date] = byD[r.date] || []).push(r); });
      body += '<tr><th class="pn" title="' + esc(p.ward) + '">' + esc(p.fullName) + '</th>' + days.map(function (dd) {
        var hol = IX.hol[dd] || wcOffInfo(dd), rs = byD[dd] || [];
        // spec 4.5: วันที่มีทั้งแถวลงเวลาจริงและใบเวรหยุดที่รับรองแล้ว — การลงเวลาชนะเสมอ (dayStatus ตรวจแถวลงเวลาก่อน)
        // ติดป้ายให้ฝ่ายเลขานุการโครงการตามไปตรวจสอบเฉยๆ ไม่เปลี่ยนลำดับความสำคัญ
        var attRow = IX.att && IX.att[p.personId + '|' + dd];
        var offRec = rs.filter(function (r) { return r.fullDay === 'Y' && isOffDuty(r.type); })[0];
        var clash = !!(attRow && offRec);
        var wait = !hol && typeof pendingOffDuty_ === 'function' && pendingOffDuty_(p.personId, dd);
        var cls = (hol ? 'hol ' : '') + (dd === st.d.today ? 'today ' : '') + (st.editor && !IX.hol[dd] ? 'cal-ed ' : '') + (clash ? 'clash' : '');
        var tip = rs.map(function (r) { return tlabel(r.type) + ' ' + (r.fullDay === 'Y' ? 'เต็มวัน' : (r.startTime ? r.startTime + '–' + r.endTime : hm(+r.minutes))) + (r.reason ? ' — ' + r.reason : ''); }).join('\n') +

        return '<td class="' + cls + '" data-cal="' + p.personId + '|' + dd + '" title="' + esc(hol ? hol.name : tip) + '">' + rs.map(function (r) {

  $('#calGrid').innerHTML = ppl.length ? '<table class="cal">' + head + '<tbody>' + body + '</tbody></table>' : '<div class="empty">ไม่มีรายชื่อในเดือนนี้</div>';

function bindRecordForm(root) {
  function sync() {
    var dur = ($('input[name=dur]:checked', root) || {}).value;
    $$('[data-show]', root).forEach(function (el) { el.classList.toggle('hide', el.getAttribute('data-show') !== dur); });

    var min = f.fullDay ? HPD() * 60 : f.startTime ? Math.max(0, toMin(f.endTime) - toMin(f.startTime)) : +f.minutes || 0;
    var days = 1;
    if (f.dateFrom && f.dateTo && f.dateTo >= f.dateFrom) {
      var pk = wcLeaveDates(f.dateFrom, f.dateTo);
      days = pk.dates.length;
      if (pk.offOnly) { pv.innerHTML = '<div class="note">วันที่เลือกอยู่นอกรอบวันทำการ — จะบันทึก <b>' + days + '</b> วันไว้เป็นข้อมูล แต่ <b>ไม่หักชั่วโมง</b>จากเวลาโครงการ</div>'; return; }
    }
    pv.innerHTML = '<div class="note">' + (days ? 'จะบันทึก <b>' + days + '</b> วันทำการ × ' + hm(min) + ' = <b>' + hrs(days * min, false) + ' ชม.</b> · ' + esc(tlabel(f.type)) +
      (deducts(f.type) ? ' (หักจากเวลาโครงการ)' : ' (ไม่หักจากเวลาโครงการ)') : 'ช่วงวันที่เลือกไม่มีวันทำการ') + '</div>';
  }
  root.addEventListener('change', sync); root.addEventListener('input', sync); sync();

function toMin(s) { var p = String(s || '0:0').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function readRecordForm(root) {
  function v(n) { var el = $('[name=' + n + ']', root); return el ? el.value : ''; }

function saveRecord(root, init) {

    res.saved.forEach(function (r) {
      var i = st.d.records.findIndex(function (x) { return x.recordId === r.recordId; });
      if (i >= 0) st.d.records[i] = r; else st.d.records.push(r);

}

      (st.editor ? '<button class="btn sm" data-edit-rec="' + r.recordId + '">แก้ไข</button>' : '') + '</div>';
  }).join('') + '</div>' : '<div class="empty">ยังไม่มีรายการที่บันทึกผ่านเว็บ</div>';
}

// ================================================================== REVIEW (ตรวจสอบ & ยืนยัน — แก้ไขในหน้าได้ทันที)
var RV_PAGE = 30;
var LEAVE3 = ['SICK', 'PERSONAL', 'VACATION'];
function rvDefaults() {
  if (!st.rv) st.rv = { tab: 'REVIEW', q: '', team: '', div: '', fy: '', month: '', type: '', page: 1 };
  return st.rv;
}
function rvMatches(r, f, ignoreTab) {
  var p = IX.people[r.personId] || {};
  if (!ignoreTab) {
    if (f.tab === 'REVIEW' && !(r.flag === 'REVIEW' || r.type === 'UNSPEC')) return false;
    if (f.tab === 'AUTO' && r.flag !== 'AUTO') return false;
    if (f.tab === 'CHECKED' && r.flag !== 'CHECKED' && !(r.source === 'WEB' && r.checkedBy)) return false;
  }
  if (f.team && p.team !== f.team) return false;
  if (f.div && p.division !== f.div) return false;
  if (f.fy && fyOf(r.date) !== +f.fy) return false;
  if (f.month && ym(r.date) !== f.month) return false;
  if (f.type && r.type !== f.type) return false;
  if (f.q) {
    var hay = (p.fullName + ' ' + p.ward + ' ' + p.sap + ' ' + (r.reason || '')).toLowerCase();
    if (hay.indexOf(f.q.toLowerCase()) === -1) return false;
  }
  return true;
}
function gapMatches(g, f) {
  var p = IX.people[g.personId] || {};
  if (f.team && p.team !== f.team) return false;
  if (f.div && p.division !== f.div) return false;
  if (f.fy && fyOf(g.from) !== +f.fy) return false;
  if (f.month && ym(g.from) !== f.month) return false;
  if (f.q && (p.fullName + ' ' + p.ward + ' ' + p.sap + ' ' + (g.q.reason || '')).toLowerCase().indexOf(f.q.toLowerCase()) === -1) return false;
  return true;
}
function srcLabel(r) {
  if (r.source === 'WEB') return 'บันทึกผ่านเว็บ' + (r.createdBy ? ' โดย ' + r.createdBy : '');
  if (r.source === 'SELF') return 'ยื่นลาออนไลน์ · ใบ ' + (r.raw || '') + (r.checkedBy ? ' · รับรองโดย ' + r.checkedBy : '');
  return 'นำเข้าจาก Excel · ' + thMonth(ym(r.date), true);
}
function signedHtml(r) {
  if (!r.checkedBy) return '';
  var ed = (st.d.editors || []).filter(function (e) { return e.name === r.checkedBy; })[0];
  return '<div class="signed">✓ ยืนยันโดย <b>' + esc(r.checkedBy) + '</b> · ' + thDate(String(r.checkedAt).slice(0, 10)) + ' ' + esc(String(r.checkedAt).slice(11, 16)) +
    (ed && ed.signature ? '<img src="' + ed.signature + '" alt="ลายมือชื่อ ' + esc(ed.name) + '">' : '') + '</div>';
}
function durOf(r) { return r.fullDay === 'Y' ? 'full' : r.startTime === '08:00' && r.endTime === '12:00' ? 'am' : r.startTime === '13:00' && r.endTime === '16:00' ? 'pm' : r.startTime ? 'time' : 'min'; }

RENDER.review = function () {
  var f = rvDefaults();
  var base = st.d.records.filter(function (r) { return rvMatches(r, f, true); });
  var cnt = { GAP: 0, REVIEW: 0, AUTO: 0, CHECKED: 0, ALL: base.length };
  var gapList = IX.gaps.filter(function (g) { return gapMatches(g, f); }); cnt.GAP = gapList.length;
  base.forEach(function (r) {
    if (r.flag === 'REVIEW' || r.type === 'UNSPEC') cnt.REVIEW++;
    if (r.flag === 'AUTO') cnt.AUTO++;
    if (r.flag === 'CHECKED' || (r.source === 'WEB' && r.checkedBy)) cnt.CHECKED++;
  });
  var tabs = [['GAP', 'คำขอที่ยังไม่มีรายการ'], ['REVIEW', 'ลาหยุด รอแยกประเภท'], ['AUTO', 'ระบบกำหนดให้ (ควรตรวจสอบ)'], ['CHECKED', 'ยืนยันแล้ว'], ['ALL', 'ทั้งหมด']];
  $('#reviewTabs').innerHTML = '<div class="seg">' + tabs.map(function (t) {
    return '<button data-rt="' + t[0] + '"' + (f.tab === t[0] ? ' class="on"' : '') + '>' + t[1] + ' · ' + cnt[t[0]] + '</button>'; }).join('') + '</div>';

  var fys = {}; IX.monthsAll.forEach(function (m) { fys[fyOf(m + '-01')] = 1; });
  var months = IX.monthsAll.filter(function (m) { return !f.fy || fyOf(m + '-01') === +f.fy; }).reverse();
  if (f.month && months.indexOf(f.month) === -1) f.month = '';
  $('#reviewFilters').innerHTML =
    '<div class="field" style="flex:1;min-width:200px"><label>ค้นหาชื่อ / หอผู้ป่วย / เหตุผล</label><input class="inp" data-rf="q" value="' + esc(f.q) + '" placeholder="พิมพ์เพื่อค้นหา"></div>' +
    '<div class="field"><label>ทีม</label><select class="inp" data-rf="team"><option value="">ทุกทีม</option>' + ['CLINICAL', 'PAS'].map(function (t) { return '<option value="' + t + '"' + (f.team === t ? ' selected' : '') + '>Team ' + TEAM_L[t] + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>งานการพยาบาล</label><select class="inp" data-rf="div"><option value="">ทั้งหมด</option>' + IX.divisions.map(function (v) { return '<option' + (f.div === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>ปีงบประมาณ</label><select class="inp" data-rf="fy"><option value="">ทุกปีงบประมาณ</option>' + Object.keys(fys).sort().reverse().map(function (y) { return '<option value="' + y + '"' + (String(f.fy) === y ? ' selected' : '') + '>' + fyLabel(+y) + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>เดือน</label><select class="inp" data-rf="month"><option value="">ทุกเดือน</option>' + months.map(function (m) { return '<option value="' + m + '"' + (f.month === m ? ' selected' : '') + '>' + thMonth(m, true) + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>ประเภท</label><select class="inp" data-rf="type"><option value="">ทุกประเภท</option>' + IX.typeOrder.map(function (c) { return '<option value="' + c + '"' + (f.type === c ? ' selected' : '') + '>' + esc(tlabel(c)) + '</option>'; }).join('') + '</select></div>' +
    '<button class="btn" data-rf-clear>ล้างตัวกรอง</button>';

  if (f.tab === 'GAP') {
    st.rvVisible = [];
    $('#reviewMeta').innerHTML = '<span>พบ <b>' + gapList.length + '</b> คำขอที่มีในสมุดบันทึก แต่ยังไม่มีรายการลาในตาราง (Excel ช่องนั้นไม่ได้ลงสี/ไม่ได้บันทึก)</span>' +
      (st.editor ? '<span>เลือก <b>＋ สร้างรายการ</b> เพื่อบันทึกตามคำขอ</span>' : '');
    $('#reviewList').innerHTML = gapList.length ? gapList.slice(0, 100).map(gapHtml).join('') : '<div class="card empty">คำขอทุกรายการมีรายการในตารางแล้ว 🎉</div>';
    $('#reviewPager').innerHTML = ''; renderReviewBar(); return;
  }
  var list = st.d.records.filter(function (r) { return rvMatches(r, f, false); })
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (IX.people[a.personId] || {}).fullName > (IX.people[b.personId] || {}).fullName ? 1 : -1; });
  var pages = Math.max(1, Math.ceil(list.length / RV_PAGE));
  if (f.page > pages) f.page = pages;
  var slice = list.slice((f.page - 1) * RV_PAGE, f.page * RV_PAGE);
  st.rvVisible = slice.map(function (r) { return r.recordId; });
  var hours = list.reduce(function (s, r) { return s + recMin(r); }, 0);
  $('#reviewMeta').innerHTML = '<span>พบ <b>' + list.length + '</b> รายการ · รวม ' + hrs(hours, false) + ' ชม.' + (pages > 1 ? ' · หน้า ' + f.page + '/' + pages : '') + '</span>' +
    (st.editor && f.tab === 'REVIEW' && list.length ? '<span>เลือกประเภทที่ถูกต้องแล้วเลือก <b>✓ ยืนยัน</b> · ระบบลงชื่อ <b>' + esc(st.d.actor) + '</b> ให้อัตโนมัติ</span>' : '');
  $('#reviewList').innerHTML = slice.length ? slice.map(rvRow).join('') : '<div class="card empty">ไม่มีรายการตามตัวกรองนี้ 🎉</div>';
  var pg = '';
  if (pages > 1) {
    pg += '<button class="btn sm" data-pg="' + (f.page - 1) + '"' + (f.page === 1 ? ' disabled' : '') + '>‹ ก่อนหน้า</button>';
    for (var i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - f.page) <= 2) pg += '<button class="btn sm' + (i === f.page ? ' primary' : '') + '" data-pg="' + i + '">' + i + '</button>';
    else if (Math.abs(i - f.page) === 3) pg += '<span class="muted">…</span>';
    pg += '<button class="btn sm" data-pg="' + (f.page + 1) + '"' + (f.page === pages ? ' disabled' : '') + '>ถัดไป ›</button>';
  }
  $('#reviewPager').innerHTML = pg;
  renderReviewBar();
};

function rvRow(r) {
  var p = IX.people[r.personId] || {}, reqs = IX.reqByPD[r.personId + '|' + r.date] || [];
  var reqTxt = reqs.map(function (q) { return q.reason; }).filter(function (x) { return x && x !== r.reason; });
  var info = '<div><div><span class="nm">' + esc(p.fullName) + '</span> <span class="muted small">' + esc(p.ward || '') + ' · ' + esc(p.division || '') + '</span></div>' +

    (r.flag ? ' <span class="flag ' + r.flag + '">' + ({ REVIEW: 'รอแยกประเภท', AUTO: 'ระบบกำหนดให้', CHECKED: 'ยืนยันแล้ว' }[r.flag] || r.flag) + '</span>' : '') + '</div>' +
    '<div class="why">📝 ' + (r.reason ? esc(r.reason) : '<span class="muted">ไม่มีบันทึกคำขอของวันนี้</span>') +

    }).join('') +
    '<select class="inp" data-e="other" style="width:auto;flex:1;min-width:120px"><option value="">ประเภทอื่น…</option>' + others.filter(function (c) { return c !== 'UNSPEC'; }).map(function (c) { return '<option value="' + c + '"' + (cur === c ? ' selected' : '') + '>' + esc(tlabel(c)) + '</option>'; }).join('') + '</select></div>' +
    '<input type="hidden" data-e="type" value="' + cur + '">' +
    '<div class="row"><select class="inp" data-e="dur" style="width:auto">' +
    [['full', 'เต็มวัน'], ['am', 'ครึ่งเช้า 08–12'], ['pm', 'ครึ่งบ่าย 13–16'], ['time', 'ระบุเวลา'], ['min', 'ระบุนาที']].map(function (o) { return '<option value="' + o[0] + '"' + (dur === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<input class="inp" type="time" data-e="start" value="' + esc(r.startTime || '08:00') + '" style="width:110px"' + (dur === 'time' ? '' : ' hidden') + '>' +
    '<input class="inp" type="time" data-e="end" value="' + esc(r.endTime || '12:00') + '" style="width:110px"' + (dur === 'time' ? '' : ' hidden') + '>' +
    '<input class="inp" type="number" min="1" max="1440" data-e="min" value="' + esc(r.minutes || '') + '" placeholder="นาที" style="width:100px"' + (dur === 'min' ? '' : ' hidden') + '></div>' +
    '<input class="inp" data-e="reason" value="' + esc(r.reason || '') + '" placeholder="เหตุผล / หมายเหตุ">' +
    '<div class="row" style="justify-content:flex-end"><button class="btn sm icon" data-edit-rec="' + r.recordId + '" title="แก้ไขเต็ม (วันที่ / ลบ)">✎</button>' +
    '<button class="btn sm primary" data-rv-save="' + r.recordId + '">✓ ยืนยัน</button></div></div>';
  return '<div class="rv2" id="rv-' + r.recordId + '"><div><input type="checkbox" data-sel="' + r.recordId + '"' + (st.reviewSel[r.recordId] ? ' checked' : '') + '></div>' + info + ed + '</div>';
}

function renderReviewBar() {
  var ids = Object.keys(st.reviewSel).filter(function (k) { return st.reviewSel[k]; });
  var bar = $('#reviewBar');
  if (!st.editor || rvDefaults().tab === 'GAP') { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  var allOn = st.rvVisible && st.rvVisible.length && st.rvVisible.every(function (id) { return st.reviewSel[id]; });
  bar.innerHTML = '<label style="display:flex;gap:8px;align-items:center;margin-right:8px"><input type="checkbox" id="selAll"' + (allOn ? ' checked' : '') + '> เลือกทั้งหน้า</label><b>' + ids.length + ' รายการ</b>' +
    '<span class="small" style="opacity:.75">· ลงชื่อ ' + esc(st.d.actor || '') + '</span><span style="flex:1"></span>' +
    '<button class="btn" data-bulk="KEEP"' + (ids.length ? '' : ' disabled') + '>✓ ยืนยันตามที่แสดง</button>' +
    LEAVE3.map(function (c) { return '<button class="btn" data-bulk="' + c + '"' + (ids.length ? '' : ' disabled') + '>ตั้งเป็น ' + esc(SHORT[c]) + '</button>'; }).join('');
}

function rvApplyLocal(ids, patch) {
  ids.forEach(function (id) { var r = IX.rec[id]; if (r) { for (var k in patch) r[k] = patch[k]; } delete st.reviewSel[id]; });
  buildIndex();
}
function rvSaveRow(id, btn) {
  var box = $('[data-ed="' + id + '"]'), r = IX.rec[id];
  function v(n) { return $('[data-e="' + n + '"]', box).value; }
  var type = v('type'), dur = v('dur');
  if (type === 'UNSPEC') return toast('กรุณาเลือกประเภท ลาป่วย / ลากิจ / Vacation ก่อนยืนยัน', true);
  var f = { recordId: id, personId: r.personId, date: r.date, type: type, reason: v('reason').trim(), fullDay: dur === 'full', startTime: '', endTime: '', minutes: '' };
  if (dur === 'am') { f.startTime = '08:00'; f.endTime = '12:00'; }
  if (dur === 'pm') { f.startTime = '13:00'; f.endTime = '16:00'; }
  if (dur === 'time') { f.startTime = v('start'); f.endTime = v('end'); }
  if (dur === 'min') f.minutes = v('min');
  btn.disabled = true;
  call('apiSaveRecord', st.token, f).then(function (res) {
    var saved = res.saved[0];
    var i = st.d.records.findIndex(function (x) { return x.recordId === id; });
    st.d.records[i] = saved; delete st.reviewSel[id]; buildIndex();
    toast('ยืนยันแล้ว · ' + tlabel(saved.type) + ' · ลงชื่อ ' + saved.checkedBy);
    var el = $('#rv-' + id);
    var stay = rvMatches(saved, rvDefaults(), false);
    if (stay && el) { el.outerHTML = rvRow(saved); var n = $('#rv-' + id); if (n) n.classList.add('saved'); RENDER_reviewCounts(); }
    else RENDER.review();
  }).catch(function (e) { handleErr(e); btn.disabled = false; });
}
function RENDER_reviewCounts() {
  // อัปเดตตัวเลขบนแท็บ/แบดจ์ โดยไม่วาดรายการใหม่ (กันตำแหน่งเลื่อน)
  var f = rvDefaults(), base = st.d.records.filter(function (r) { return rvMatches(r, f, true); });
  var c = { REVIEW: 0, AUTO: 0, CHECKED: 0, ALL: base.length };
  base.forEach(function (r) { if (r.flag === 'REVIEW' || r.type === 'UNSPEC') c.REVIEW++; if (r.flag === 'AUTO') c.AUTO++; if (r.flag === 'CHECKED' || (r.source === 'WEB' && r.checkedBy)) c.CHECKED++; });
  $$('#reviewTabs [data-rt]').forEach(function (b) { var k = b.getAttribute('data-rt'); b.textContent = b.textContent.replace(/· \d+$/, '· ' + c[k]); });
  renderReviewBar();
}

document.addEventListener('click', function (e) {

  var g = IX.gaps.filter(function (x) { return x.personId === k[0] && x.from === k[1]; })[0]; if (g) gapOpen(g);
});
$('#leaveTabReview').addEventListener('click', function (e) {
  var f = rvDefaults();
  var t = e.target.closest('[data-rt]');
  if (t) { f.tab = t.getAttribute('data-rt'); f.page = 1; st.reviewSel = {}; RENDER.review(); return; }

    var box = pk.closest('[data-ed]');
    $$('.pick', box).forEach(function (b) { b.classList.toggle('on', b === pk); });

    return;
  }
  var sv = e.target.closest('[data-rv-save]');

      toast('มีรายการ "ลาหยุด ยังไม่แยกประเภท" ในที่เลือก — ให้ตั้งเป็น ป่วย / กิจ / Vac ก่อน', true); return;
    }

    }).catch(function (err) { handleErr(err); b.disabled = false; });
  }
});
$('#leaveTabReview').addEventListener('change', function (e) {

    $('[data-e="type"]', box).value = e.target.value; $$('.pick', box).forEach(function (b) { b.classList.remove('on'); });

function openSignatureModal(after) {
  var me = (st.d.editors || []).filter(function (e) { return e.name === st.d.actor; })[0] || {};
  openModal('<h3>ลายมือชื่อ · ' + esc(st.d.actor) + '</h3><p class="muted small">วาดครั้งเดียว ระบบใช้ลงชื่อในรายการที่ท่านยืนยันและในรายงาน PDF</p>' +
    '<canvas class="sig-pad" id="sigPad" width="1200" height="360"></canvas>' +
    '<div class="field" style="margin-top:12px"><label>ตำแหน่ง (แสดงใต้ลายมือชื่อในรายงาน)</label><input class="inp" id="sigPos" value="' + esc(me.position || '') + '" placeholder="เช่น เลขานุการโครงการ"></div>' +
    '<div class="actions"><button class="btn" id="sigClear" style="margin-right:auto">ล้าง</button><button class="btn" data-close>ข้ามไปก่อน</button><button class="btn primary" id="sigSave">บันทึกลายมือชื่อ</button></div>');
  var c = $('#sigPad'), g = c.getContext('2d'), drawing = false, inked = false, last = null;
  g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0f2a6b';
  function pt(ev) { var r = c.getBoundingClientRect(); return { x: (ev.clientX - r.left) * c.width / r.width, y: (ev.clientY - r.top) * c.height / r.height }; }
  c.addEventListener('pointerdown', function (ev) { drawing = true; last = pt(ev); c.setPointerCapture(ev.pointerId); });
  c.addEventListener('pointermove', function (ev) { if (!drawing) return; var p = pt(ev); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; inked = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { c.addEventListener(n, function () { drawing = false; }); });
  $('#sigClear').onclick = function () { g.clearRect(0, 0, c.width, c.height); inked = false; };
  $('#sigSave').onclick = function () {
    if (!inked) return toast('กรุณาวาดลายมือชื่อก่อน', true);
    // ย่อเป็นภาพเล็ก (≈ 360×108) ให้พอดีกับช่องในชีต
    var o = document.createElement('canvas'); o.width = 360; o.height = 108;
    o.getContext('2d').drawImage(c, 0, 0, o.width, o.height);
    var b = this; b.disabled = true;
    call('apiSaveSignature', st.token, o.toDataURL('image/png'), $('#sigPos').value).then(function (ed) {
      var list = st.d.editors || (st.d.editors = []);
      var i = list.findIndex(function (x) { return x.name === ed.name; });
      var row = { editorId: ed.editorId, name: ed.name, position: ed.position, hasSignature: true, signature: ed.signature };
      if (i >= 0) list[i] = row; else list.push(row);
      closeModal(); toast('บันทึกลายมือชื่อเรียบร้อยแล้ว'); if (after) after(); else rerender();
    }).catch(function (e) { handleErr(e); b.disabled = false; });
  };
}

/** ฉบับที่ 2: รายละเอียดการลา — วันที่ลา · วันที่ยื่น · ผู้รับรอง */
/**
 * วันที่ยื่น/แจ้งของรายการหนึ่ง
 *   1) ค่าที่ฝ่ายเลขานุการโครงการกรอกเอง (Records.submitDate)
 *   2) ใบลาออนไลน์ → วันที่ส่ง (LeaveRequests.submittedAt)
 *   3) ไม่มี → ว่าง (ไม่เดาจากวันที่บันทึกเข้าระบบ)
 */
function submitDateOf(rec, q) {
  if (rec && isDate(rec.submitDate)) return rec.submitDate;
  var sd = q && String(q.submittedAt || '').slice(0, 10);
  return isDate(sd) ? sd : '';
}
function leaveReqIndex() {

  });
  return ix;
}

  return html + '<p style="font-size:12px;color:#64748b;margin-top:14px">วันที่ยื่น = วันที่ผู้ลาแจ้ง · ใบลาที่ยื่นออนไลน์ระบบกรอกให้เอง · รายการที่ฝ่ายเลขานุการโครงการบันทึกแทนขึ้น "– ยังไม่ระบุ" จนกว่าจะกรอก' +
    (st.editor ? ' <b>คลิกที่ช่องวันที่ยื่นเพื่อแก้ได้ทันที</b>' : '') +

/**
 * ตารางรายการลามาตรฐาน — ใช้ร่วมกันทุกรายงาน (รายละเอียดการลา · รายบุคคล · รายงานการลงเวลา)
 * ลำดับคอลัมน์: # · วันที่ลา · วันที่ยื่น · ล่วงหน้า · [ชื่อ-สกุล · หน่วยงาน] · ประเภท · ช่วงเวลา · ชม. · เหตุผล · ผู้รับรอง

var LEAVE_W_ONE = [4, 11, 11, 8, 16, 11, 7, 20, 12];
var LEAVE_W_MANY = [3, 9, 9, 6, 13, 11, 12, 9, 5, 14, 9];
function leaveRowsSort(rows) {
  rows.forEach(function (o) { o.sub = submitDateOf(o.x, o.q); o.lead = o.sub ? daysBetween(o.sub, o.x.date) : null; });
  return rows.sort(function (a, b) {
    if (a.x.date !== b.x.date) return a.x.date < b.x.date ? -1 : 1;
    var sa = a.sub || '9999', sb = b.sub || '9999';
    if (sa !== sb) return sa < sb ? -1 : 1;
    return a.p.fullName.localeCompare(b.p.fullName, 'th');
  });
}

    }).join('') + '</tbody></table>';

function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }

/** คลิกช่อง "วันที่ยื่น" ในรายงาน → แก้ได้ทันที */
document.addEventListener('click', function (e) {
  var td = e.target.closest('#reportDoc .sub-cell[data-subrec]');
  if (!td || !st.editor || td.querySelector('input')) return;
  var id = td.getAttribute('data-subrec'), rec = IX.rec[id];
  if (!rec) return;
  var cur = submitDateOf(rec, leaveReqIndex()[id]);
  var old = td.innerHTML;
  td.innerHTML = '<input class="inp sm" type="date" value="' + esc(cur) + '" max="' + esc(rec.date) + '" style="min-width:140px">';
  var inp = td.querySelector('input');
  inp.focus();
  var done = false;
  function finish(save) {
    if (done) return; done = true;
    var v = inp.value;
    if (!save || v === cur) { td.innerHTML = old; return; }
    td.textContent = 'กำลังบันทึก…';
    call('apiSetSubmitDate', st.token, id, v).then(function (r) {
      var i = st.d.records.findIndex(function (x) { return x.recordId === r.recordId; });
      if (i >= 0) st.d.records[i] = r;
      buildIndex(); toast(v ? 'บันทึกวันที่ยื่นแล้ว' : 'ล้างวันที่ยื่นแล้ว'); RENDER.report();
    }).catch(function (x) { td.innerHTML = old; handleErr(x); });
  }
  inp.addEventListener('change', function () { finish(true); });
  inp.addEventListener('blur', function () { finish(true); });
  inp.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') finish(true);
    if (ev.key === 'Escape') finish(false);

/** แถบเทียบผลงานของผู้ปฏิบัติงานโครงการกับค่าเฉลี่ยทั้งโครงการ */

/** สมุด Excel ของคนเดียว → base64 (ไว้แนบอีเมล) */
function personXlsxB64(p, r) {
  if (!window.XLSX) return '';
  try {
    var wb = XLSX.utils.book_new();
    var a = aggregate([p], r.from, r.to).by[p.personId] || { byType: {}, ded: 0, cap: 0, pct: null };
    var x = attStats(p, r.from, r.to);
    var info = [['รายงานการปฏิบัติงาน'], [p.fullName], [p.sap ? 'SAP ' + p.sap : ''], [p.ward], [r.label], [],
      ['วันทำการ', x.work], ['มาปฏิบัติงาน', x.present]]
      .concat(x.offDuty ? [['หยุดตามเวร (วัน) — ไม่ใช่การลา ไม่อยู่ในตัวหาร', x.offDuty]] : [])
      .concat([
      ['อัตราการเข้าร่วม (%)', x.rate == null ? '' : +(x.rate * 100).toFixed(1)],
      ['เวลาปฏิบัติงาน (ชม.)', +(x.workMin / 60).toFixed(2)],
      ['เวลาประชุมภายใน (ชม.)', +(x.meetMin / 60).toFixed(2)],
      ['นอกเวลาราชการ (ชม.)', +(x.otMin / 60).toFixed(2)],
      ['% เวลาโครงการ', a.pct == null ? '' : +(a.pct * 100).toFixed(1)]]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'สรุป');
    var at = [['วันที่', 'เวลาเข้างาน', 'เวลากลับ', 'วิธี', 'หมายเหตุ']];
    (st.d.attendance || []).filter(function (q) { return q.personId === p.personId && q.date >= r.from && q.date <= r.to; })
      .sort(function (m, n) { return m.date < n.date ? -1 : 1; })
      .forEach(function (q) { at.push([q.date, hmOf(q.inAt), hmOf(q.outAt), q.inMethod, q.note]); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(at), 'ลงเวลา');
    var ix = leaveReqIndex();
    var allRecs = (IX.recByP[p.personId] || []).filter(function (q) { return q.date >= r.from && q.date <= r.to; });
    var lv = [['วันที่ลา', 'วันที่ยื่น', 'ล่วงหน้า (วัน)', 'ประเภท', 'เต็มวัน', 'เริ่ม', 'สิ้นสุด', 'ชั่วโมง', 'เหตุผล', 'ผู้รับรอง']];
    leaveRowsSort(allRecs.filter(function (q) { return !isOffDuty(q.type); }).map(function (q) { return { p: p, x: q, q: ix[q.recordId] }; })).forEach(function (o) {
      var q = o.x, qr = o.q;
      lv.push([q.date, o.sub, o.lead == null ? '' : o.lead, tlabel(q.type), q.fullDay === 'Y' ? 'เต็มวัน' : '', q.startTime, q.endTime,
               +(recMin(q) / 60).toFixed(2), q.reason, q.checkedBy || (qr && qr.decidedBy) || '']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lv), 'การลา');
    var offRecsX = allRecs.filter(function (q) { return isOffDuty(q.type); });
    if (offRecsX.length) {
      var od = [['วันที่', 'ประเภท']];
      offRecsX.forEach(function (q) { od.push([q.date, tlabel(q.type)]); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(od), 'หยุดตามเวร');
    }
    var out = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
    return out;
  } catch (e) { return ''; }
}
